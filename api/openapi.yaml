# DataRay API 契约（单一权威来源）
#
# 修改接口时：先改本文件 → `make api-gen` 双端重新生成 → 双端消费生成物。
# 禁止直接编辑生成物（backend/internal/idls/gen_types.go、frontend/src/idls/gen_types.ts）。
openapi: 3.0.3
info:
  title: DataRay API
  description: |
    拖拽式 BI 可视化分析平台 API。

    ## 响应契约
    所有端点（含 /health）HTTP 状态码恒为 200；业务结果由响应体 Envelope 表达：
    `{ code, msg, trace, data }`。code 枚举与
    `backend/internal/response/response.go` 的常量一一对应
    （20000 成功，20100–20500 客户端/业务错误，50000 服务端内部错误）。

    data 在错误或无数据时统一归一化为空对象 `{}` / 空数组 `[]`，不会出现 null。
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 本地开发后端
tags:
  - name: health
    description: 健康检查（响应 Envelope 建模样例）
  - name: datasources
    description: 数据源管理（CRUD、连接测试、库表元数据、预览与字段分布）
  - name: datasets
    description: 数据集管理（CRUD、列定义、预览、查询）
  - name: charts
    description: 图表管理（CRUD、数据集取数预览、图表语义查询）
  - name: shares
    description: 分享管理（创建、列表、详情、密码校验）与公开视图跳转
paths:
  /health:
    get:
      tags:
        - health
      summary: 健康检查
      description: 样例端点，验证统一响应 Envelope 的契约建模。
      operationId: getHealth
      responses:
        '200':
          description: HTTP 恒 200；服务健康由 Envelope.code = 20000 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/datasources:
    get:
      tags:
        - datasources
      summary: 数据源列表
      description: |
        分页返回数据源数组；无结果时 data 为空数组（handler 将 nil 归一化为 []）。
      operationId: listDatasources
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            每页条数。后端 getPaginationParams（handler/helpers.go）：缺省 100；
            值 ≤0 或 >1000 时回落为 100（实际硬上限是 1000）。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceListResponse'
    post:
      tags:
        - datasources
      summary: 创建数据源
      description: |
        type 为空时后端缺省填 "postgresql"。响应 data 为创建后的 Datasource，
        不含 password（entity 的 Password 为 json:"-"）。
      operationId: createDatasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
  /api/datasources/test:
    post:
      tags:
        - datasources
      summary: 测试数据源连接
      description: |
        使用未落库的连接参数测试连通性。type 为空时后端缺省填 "postgresql"；
        不支持的驱动类型或连接失败返回 Envelope.code = 20100（BadRequest）。
      operationId: testDatasourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceTestConnectionRequest'
      responses:
        '200':
          description: 'HTTP 恒 200；连接成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasources/{id}:
    get:
      tags:
        - datasources
      summary: 获取数据源详情
      operationId: getDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
    put:
      tags:
        - datasources
      summary: 更新数据源
      description: |
        password 为空字符串或缺省表示保留数据库中已存密码（service.Update 明确
        保留原值），因此响应永远不回显密码。
      operationId: updateDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
    delete:
      tags:
        - datasources
      summary: 删除数据源
      operationId: deleteDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasources/{id}/tables:
    get:
      tags:
        - datasources
      summary: 列出数据源下的表
      description: 实时连接目标数据源读取表元数据；返回 TableInfo 数组。
      operationId: listDatasourceTables
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
  /api/datasources/{id}/tables/{table}/columns:
    get:
      tags:
        - datasources
      summary: 列出表的列元数据
      description: |
        {table} 与 gin 路由 `:table` 通配符对应；表名必须是合法标识符，
        前端调用时做 URL 编码。handler 以 map 组装，仅含 name/data_type/comment 三个键。
      operationId: listTableColumns
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
        - $ref: '#/components/parameters/TableName'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnListResponse'
  /api/datasources/{id}/tables/{table}/data:
    get:
      tags:
        - datasources
      summary: 分页读取表数据
      description: |
        {table} 与 gin 路由 `:table` 通配符对应。sort_field 缺省用第一个主键列，
        且必须是主键列之一；sort_order 按大小写不敏感匹配 desc，其余一律归一为 ASC。
      operationId: getTableData
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
        - $ref: '#/components/parameters/TableName'
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始；≤0 被后端归一为 1。
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: 每页行数；≤0 归一为 20，上限 100（超出截断为 100）。
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort_field
          in: query
          required: false
          description: 排序列；必须是该表的主键列，否则返回 Envelope.code = 50000（错误消息含 "sort field must be a primary key"）。
          schema:
            type: string
        - name: sort_order
          in: query
          required: false
          description: 排序方向，ASC/DESC（大小写不敏感）；缺省 ASC。
          schema:
            type: string
            default: ASC
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataResponse'
  /api/datasources/{id}/preview:
    post:
      tags:
        - datasources
      summary: 预览数据源表或 SQL 结果
      description: |
        query_type = "table" 时以 table_name（合法标识符）为源；query_type = "sql" 时以
        query_sql 为源（包成子查询）。后端固定取前 10 行。两源字段按 query_type 二选一，
        因此 schema 不强制 required。
      operationId: previewDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcePreviewRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcePreviewResponse'
  /api/datasources/{id}/field-distribution:
    post:
      tags:
        - datasources
      summary: 字段值分布统计
      description: |
        field_name 必填（缺失返回 Envelope.code = 20100）。limit ≤0 或 >50 时后端归一为 20。
        数据源/查询源的解析规则与 preview 端点一致。
      operationId: getDatasourceFieldDistribution
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDistributionRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDistributionResponse'
  /api/datasets:
    get:
      tags:
        - datasets
      summary: 数据集列表
      description: |
        分页返回数据集数组；无结果时 data 为空数组。分页参数与数据源列表一致
        （limit 缺省 100、offset 缺省 0，helpers.go 对 ≤0 或 >1000 回落 100）。
      operationId: listDatasets
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数；缺省 100，≤0 或 >1000 后端回落为 100。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
    post:
      tags:
        - datasets
      summary: 创建数据集
      description: |
        tags/columns 是 JSON 数组的字符串形态（后端以 string 存储，非数组）；
        query_type 为空后端填 "table"，mode 为空填 "direct"，tags/columns 为空填 "[]"。
        table_name 与 query_sql 按 query_type 二选一，未传的置为 null。
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
  /api/datasets/{id}:
    get:
      tags:
        - datasets
      summary: 获取数据集详情
      operationId: getDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
    delete:
      tags:
        - datasets
      summary: 删除数据集
      operationId: deleteDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasets/{id}/columns:
    get:
      tags:
        - datasets
      summary: 获取数据集列定义
      description: 返回 DatasetColumn 数组（数据集 columns JSON 字段解析后的列定义）。
      operationId: getDatasetColumns
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnListResponse'
    post:
      tags:
        - datasets
      summary: 更新数据集列定义
      description: |
        请求体是 DatasetColumn 裸数组（不是 {columns: [...]} 包装对象）。
        成功 data 为更新后的 Dataset（columns 字段已写回）。
      operationId: updateDatasetColumns
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DatasetColumn'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
  /api/datasets/{id}/preview:
    get:
      tags:
        - datasets
      summary: 预览数据集数据
      description: 按数据集的表/SQL 源实时取数（后端固定取前 10 行）；data 为 PreviewResult。
      operationId: previewDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPreviewResponse'
  /api/datasets/{id}/query:
    post:
      tags:
        - datasets
      summary: 按 QueryConfig 查询数据集
      description: |
        请求体为 entity.QueryConfig（维度组/指标组/过滤/排序/limit）；
        data 为查询结果行数组，每行是列名到任意 JSON 值的映射。
      operationId: queryDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryConfig'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQueryResponse'
  /api/charts:
    get:
      tags:
        - charts
      summary: 图表列表
      description: |
        分页返回图表数组；无结果时 data 为空数组（handler 将 nil 归一化为 []）。
        分页参数与数据源/数据集列表一致（helpers.go getPaginationParams：
        limit 缺省 100、≤0 或 >1000 回落 100；offset 缺省 0、负数归一为 0）。
      operationId: listCharts
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数；缺省 100，≤0 或 >1000 后端回落为 100。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartListResponse'
    post:
      tags:
        - charts
      summary: 创建图表
      description: |
        config 是 JSON 文档的字符串形态（后端以 string 存储，非对象）；为空时
        后端缺省填 "{}"。chart_type 与 dataset_id 后端不做存在性/枚举强校验
        （无效 dataset_id 要到取数时才暴露）；name/dataset_id/chart_type 为
        规范性收紧的 required（后端 ShouldBindJSON 零值可过，见 task-3 报告）。
      operationId: createChart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
  /api/charts/{id}:
    get:
      tags:
        - charts
      summary: 获取图表详情
      operationId: getChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
    put:
      tags:
        - charts
      summary: 更新图表
      description: |
        PUT 为全量覆盖：请求体绑定 {name, dataset_id, chart_type, config} 四字段，
        未提供的字段以零值写库（不是增量合并）。config 缺省/空串被后端替换为 "{}"。
        成功 data 为更新后回读的 Chart。
      operationId: updateChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
    delete:
      tags:
        - charts
      summary: 删除图表
      operationId: deleteChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/charts/{id}/data:
    get:
      tags:
        - charts
      summary: 图表数据预览取数
      description: |
        非语义化图表查询：按图表绑定数据集的表/SQL 源实时取前 100 行
        （query.WrapPreviewSQL，service/chart.GetData）。响应 data 是裸数据行数组
        （DataRow[]，经归一化恒为数组），不是 POST /api/charts/query 的
        ChartDataResult 形状。所有失败（含图表/数据集不存在、取数失败）统一
        Envelope.code = 50000（handler.GetData 走 InternalError，不区分 404）。
      operationId: getChartData
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDataRowsResponse'
  /api/charts/query:
    post:
      tags:
        - charts
      summary: 图表语义查询（旧协议）
      description: |
        请求体为 entity.ChartQueryRequest（字段级核对清单见 ChartQueryRequest schema
        注释；Batch 3 将迁移到 ChartSpec/QuerySpec 协议，见 components 中的内部建模）。
        成功 data 为 ChartDataResult：{ data, select_sql, count_sql }，其中 data 的
        形状由 chart_type 决定（table/pie/axis/scatter 四族，另加 pivot，详见
        ChartDataResult 描述）。select_sql 成功时恒返回；count_sql 仅 table +
        pagination 分支返回。执行失败统一 Envelope.code = 50000。
      operationId: queryChart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartQueryResponse'
  /api/shares:
    get:
      tags:
        - shares
      summary: 分享列表
      description: |
        返回全部分享（按 id 倒序），不支持分页参数（handler 不读取 limit/offset）。
        无结果时 data 为空数组。
      operationId: listShares
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListResponse'
    post:
      tags:
        - shares
      summary: 创建分享
      description: |
        后端生成随机 token（16 字节，格式 hex(8B)-hex(8B)）。password 非空时以
        bcrypt（cost 10）哈希落库；expires_at 必须是 RFC3339，格式非法被后端静默
        忽略（即不设置过期）。chart_id 不校验图表存在性。响应 data 为 Share，
        password 永不回显（json:"-"），密码保护状态经 has_password 暴露。
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Share（含 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /api/shares/{token}:
    get:
      tags:
        - shares
      summary: 按 token 获取分享详情
      description: |
        token 不存在时 Envelope.code = 20300（"share not found"）。不做密码校验、
        不校验过期（过期只在 GET /share/{token} 公开视图判断）。
      operationId: getShare
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /api/shares/{token}/verify:
    post:
      tags:
        - shares
      summary: 校验分享密码
      description: |
        校验通过后返回 Share（含 chart_id，供前端跳转取数）。无密码的分享恒通过。
        密码错误或分享不存在统一 Envelope.code = 20100（handler 走 BadRequest）。
        存储侧 bcrypt 校验；遗留明文比对成功后透明升级为 bcrypt 哈希。
      operationId: verifySharePassword
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVerifyRequest'
      responses:
        '200':
          description: HTTP 恒 200；校验通过 data 为 Share，失败 data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /share/{token}:
    get:
      tags:
        - shares
      summary: 公开分享视图（浏览器入口，302 跳转）
      description: |
        非 Envelope JSON 端点：成功返回 HTTP 302，Location 指向前端 hash 路由
        "/#/share/{token}"。密码保护不拦截本端点（密码校验走
        /api/shares/{token}/verify），有/无密码均 302。失败才返回 HTTP 200
        Envelope：分享不存在 code=20300；已过期 code=20400
        （"share link has expired"，按 expires_at RFC3339 与当前时间比较）。
      operationId: viewShare
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '302':
          description: 重定向到前端分享页面（唯一成功形态，无响应体）
          headers:
            Location:
              description: '前端 hash 路由 /#/share/{token}'
              schema:
                type: string
        '200':
          description: HTTP 200 仅出现在失败路径（20300 不存在 / 20400 已过期）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
components:
  schemas:
    ResponseCode:
      type: integer
      description: |
        业务状态码，与 backend/internal/response/response.go 常量一一对应。
      enum:
        - 20000
        - 20100
        - 20200
        - 20300
        - 20400
        - 20500
        - 50000
      x-enum-varnames:
        - CodeSuccess
        - CodeBadRequest
        - CodeUnauthorized
        - CodeNotFound
        - CodeBusinessError
        - CodeThirdPartyErr
        - CodeInternalError
    Envelope:
      type: object
      description: 统一响应封装；HTTP 状态码恒为 200，业务状态由 code 表达。
      required:
        - code
        - msg
        - trace
        - data
      properties:
        code:
          $ref: '#/components/schemas/ResponseCode'
        msg:
          type: string
          description: 提示消息；成功为 "success"，错误为可读错误描述
        trace:
          type: string
          description: 请求追踪 ID（X-Request-ID）
        data:
          description: 业务数据；错误或无数据时为空对象 {}，不为 null
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthResponse:
      description: GET /health 响应：Envelope 特化 data 为 HealthData。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    OkData:
      type: object
      description: 删除/测试连接等无业务负载端点的成功负载。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    OkResponse:
      description: 'Envelope 特化 data 为 OkData（{status: "ok"}）。'
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/OkData'
    Datasource:
      type: object
      description: |
        数据源响应实体（entity.Datasource）。password 为 json:"-" 永不外泄，
        因此本 schema 不含 password 字段。
      required:
        - id
        - name
        - type
        - host
        - port
        - database_name
        - username
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: >-
            驱动类型；后端 datasource.NewDriver 支持 postgresql / mysql /
            clickhouse / starrocks（创建时后端不做枚举强校验，落库什么返回什么）。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    DatasourceCreateRequest:
      type: object
      description: POST /api/datasources 请求体；password 仅出现在请求侧。
      required:
        - name
        - type
        - host
        - port
        - database_name
        - username
        - password
      properties:
        name:
          type: string
        type:
          type: string
          description: 为空时后端缺省填 "postgresql"。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: 连接密码；落库前 AES-GCM 加密（DATARAY_SECURITY_KEY）。
    DatasourceUpdateRequest:
      type: object
      description: |
        PUT /api/datasources/{id} 请求体。password 可缺省/空串：
        后端保留已存密码，不覆盖为空。
      required:
        - name
        - type
        - host
        - port
        - database_name
        - username
      properties:
        name:
          type: string
        type:
          type: string
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: 空字符串或缺省表示保留原密码。
    DatasourceTestConnectionRequest:
      type: object
      description: POST /api/datasources/test 请求体（无 name，不落库）。
      required:
        - type
        - host
        - port
        - database_name
        - username
        - password
      properties:
        type:
          type: string
          description: 为空时后端缺省填 "postgresql"。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
    TableInfo:
      type: object
      description: 表元数据（entity.TableInfo）。
      required:
        - name
        - comment
      properties:
        name:
          type: string
        comment:
          type: string
    ColumnInfo:
      type: object
      description: >-
        列元数据；datasource handler 以 map 组装，仅含 name/data_type/comment
        三个键（前端手写的 role/is_virtual/expression 不由该端点返回）。
      required:
        - name
        - data_type
        - comment
      properties:
        name:
          type: string
        data_type:
          type: string
        comment:
          type: string
    DataRow:
      type: object
      additionalProperties: true
      description: 结果行：列名到任意 JSON 值的映射，值可能为 null。
    PreviewResult:
      type: object
      description: >-
        预览结果（entity.PreviewResult）；两字段经 response 归一化，
        恒为数组（不会为 null）。
      required:
        - columns
        - data
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
    TableDataResult:
      type: object
      description: >-
        分页表数据（entity.TableDataResult）；数组字段经归一化恒为数组，
        无主键时 primary_keys 为空数组。
      required:
        - columns
        - data
        - total
        - primary_keys
        - page
        - page_size
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
        total:
          type: integer
          format: int64
        primary_keys:
          type: array
          items:
            type: string
        page:
          type: integer
        page_size:
          type: integer
    DatasourcePreviewRequest:
      type: object
      description: >-
        POST /api/datasources/{id}/preview 请求体；table_name 与 query_sql 按
        query_type 二选一（"table" 用 table_name 且须为合法标识符，"sql" 用 query_sql），
        后端不做强校验，故均非 required。
      properties:
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: '"table" 或 "sql"；缺省/其他值按 table 分支处理。'
    FieldDistributionRequest:
      type: object
      description: POST /api/datasources/{id}/field-distribution 请求体。
      required:
        - field_name
      properties:
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: 数据源解析规则与 preview 一致。
        field_name:
          type: string
          description: 统计字段名；缺失时后端返回 20100。
        limit:
          type: integer
          description: 分布桶数上限；≤0 或 >50 后端归一为 20。
    FieldDistribution:
      type: object
      description: 字段值分布（entity.FieldDistribution）；distribution 恒为数组。
      required:
        - field_name
        - total_count
        - unique_count
        - distribution
      properties:
        field_name:
          type: string
        total_count:
          type: integer
          format: int64
        unique_count:
          type: integer
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/FieldValueCount'
    FieldValueCount:
      type: object
      description: 单个取值的计数与占比。
      required:
        - value
        - count
        - percentage
      properties:
        value: {}
        count:
          type: integer
          format: int64
        percentage:
          type: number
          format: double
          description: 百分比，保留两位小数（如 12.34）。
    Dataset:
      type: object
      description: >-
        数据集响应实体（entity.Dataset）。tags/columns/quality_rules/shard_keys 是
        JSON 文档的字符串形态；指针字段序列化时键恒在，值可为 null。
      required:
        - id
        - name
        - datasource_id
        - table_name
        - query_sql
        - query_type
        - mode
        - accelerate_config
        - description
        - tags
        - refresh_strategy
        - preview_data
        - quality_rules
        - columns
        - shard_enabled
        - shard_keys
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        datasource_id:
          type: integer
        table_name:
          type: string
          nullable: true
        query_sql:
          type: string
          nullable: true
        query_type:
          type: string
          description: '"table" 或 "sql"。'
        mode:
          type: string
          description: 当前后端语义为 "direct"（前端类型含 "accelerated"，后端不产出）。
        accelerate_config:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: string
          description: JSON 数组字符串，如 '["a","b"]'；缺省 "[]"。
        refresh_strategy:
          type: string
          nullable: true
        preview_data:
          type: string
          nullable: true
        quality_rules:
          type: string
          description: JSON 数组字符串；缺省 "[]"。
        columns:
          type: string
          description: DatasetColumn 数组的 JSON 字符串；缺省 "[]"。
        shard_enabled:
          type: boolean
        shard_keys:
          type: string
          description: 分片键的 JSON 数组字符串。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    DatasetCreateRequest:
      type: object
      description: >-
        POST /api/datasets 请求体。table_name/query_sql/description 未传或为空串时
        后端置为 null；query_type/mode 为空缺省 "table"/"direct"；tags/columns 为空
        缺省 "[]"。
      required:
        - name
        - datasource_id
        - query_type
      properties:
        name:
          type: string
        datasource_id:
          type: integer
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: '"table" 或 "sql"。'
        mode:
          type: string
          description: 为空时后端缺省 "direct"。
        description:
          type: string
        tags:
          type: string
          description: JSON 数组字符串（非数组本体）。
        columns:
          type: string
          description: DatasetColumn 数组的 JSON 字符串。
        shard_enabled:
          type: boolean
        shard_keys:
          type: string
          description: 分片键的 JSON 数组字符串。
    DatasetColumn:
      type: object
      description: 数据集列定义（entity.DatasetColumn）；JSON 字段名为 snake_case 的 type_config。
      required:
        - name
        - expr
        - type
        - type_config
        - comment
        - role
      properties:
        name:
          type: string
        expr:
          type: string
        type:
          type: string
          description: 标准数据类型（int/float/decimal/string/date/datetime/array/dict/boolean 等）。
        type_config:
          $ref: '#/components/schemas/TypeConfig'
        comment:
          type: string
        role:
          type: string
          description: '"dimension" 或 "metric"。'
    TypeConfig:
      type: object
      description: 类型相关配置（entity.TypeConfig）。
      required:
        - precision
        - scale
      properties:
        precision:
          type: integer
        scale:
          type: integer
    QueryConfig:
      type: object
      description: >-
        POST /api/datasets/{id}/query 请求体（entity.QueryConfig）。
        所有字段可缺省（后端绑定零值）。
      properties:
        dimension_groups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        metric_groups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sort:
          $ref: '#/components/schemas/SortConfig'
        limit:
          type: integer
    FieldGroup:
      type: object
      description: 维度/指标字段组。
      required:
        - id
        - fields
      properties:
        id:
          type: string
        fields:
          type: array
          items:
            type: string
        alias:
          type: string
          description: omitempty：空值不会出现在请求 JSON 中。
    Filter:
      type: object
      description: 过滤条件。
      required:
        - id
        - field
        - operator
        - value
        - logic
      properties:
        id:
          type: string
        field:
          type: string
        operator:
          type: string
        value: {}
        value_end: {}
          # 后端为 interface{}（带 omitempty）：区间过滤上界，任意 JSON 值
        logic:
          type: string
          description: 与其他条件的连接逻辑（如 "and" / "or"）。
    SortConfig:
      type: object
      required:
        - field
        - order
      properties:
        field:
          type: string
        order:
          type: string
          description: '"asc" 或 "desc"。'
    DatasourceListResponse:
      description: GET /api/datasources 响应：data 为 Datasource 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Datasource'
    DatasourceResponse:
      description: 数据源 CRUD 响应：data 为单个 Datasource。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Datasource'
    TableListResponse:
      description: GET /api/datasources/{id}/tables 响应：data 为 TableInfo 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TableInfo'
    ColumnListResponse:
      description: GET /api/datasources/{id}/tables/{table}/columns 响应：data 为 ColumnInfo 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ColumnInfo'
    TableDataResponse:
      description: GET /api/datasources/{id}/tables/{table}/data 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TableDataResult'
    DatasourcePreviewResponse:
      description: POST /api/datasources/{id}/preview 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PreviewResult'
    FieldDistributionResponse:
      description: POST /api/datasources/{id}/field-distribution 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/FieldDistribution'
    DatasetListResponse:
      description: GET /api/datasets 响应：data 为 Dataset 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Dataset'
    DatasetResponse:
      description: 数据集 CRUD / 列更新响应：data 为单个 Dataset。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Dataset'
    DatasetColumnListResponse:
      description: GET /api/datasets/{id}/columns 响应：data 为 DatasetColumn 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DatasetColumn'
    DatasetPreviewResponse:
      description: GET /api/datasets/{id}/preview 响应：data 为 PreviewResult。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PreviewResult'
    DatasetQueryResponse:
      description: POST /api/datasets/{id}/query 响应：data 为结果行数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DataRow'
    Chart:
      type: object
      description: |
        图表响应实体（entity.Chart，backend/internal/domain/entity/chart.go）。
        config 是 JSON 文档的字符串形态（后端以 string 存储，非对象）。
      required:
        - id
        - name
        - dataset_id
        - chart_type
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: >-
            后端不做强校验、落库什么返回什么。查询层已知取值：table / bar / line /
            pie / area / scatter / pivot；未知值按 axis 处理器回退
            （query.GetProcessor default 分支）。
        config:
          type: string
          description: 图表配置的 JSON 字符串；创建/更新为空时后端写 "{}"。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    ChartCreateRequest:
      type: object
      description: >-
        POST /api/charts 请求体。后端整体绑定 entity.Chart（额外键与 id/created_at
        不参与 service 落库映射）；name/dataset_id/chart_type 为规范性收紧的 required
        （后端零值可过，见 task-3 报告）。
      required:
        - name
        - dataset_id
        - chart_type
      properties:
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: 已知取值见 Chart.chart_type；后端不做枚举校验。
        config:
          type: string
          description: JSON 字符串；缺省/空串后端填 "{}"。
    ChartUpdateRequest:
      type: object
      description: >-
        PUT /api/charts/{id} 请求体（handler 匿名 struct：name/dataset_id/
        chart_type/config）。全量覆盖语义：未提供的可填字段以零值写库。
      required:
        - name
        - dataset_id
        - chart_type
      properties:
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
        config:
          type: string
          description: 缺省/空串被后端替换为 "{}"（覆盖原配置，非保留）。
    ChartMetricConfig:
      type: object
      description: 指标聚合配置（entity.MetricConfig，chart.go:26-30）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
        agg:
          type: string
          description: >-
            聚合函数：sum / avg / count / max / min；未知值后端按 SUM 回退
            （query.AggregationType.GetAggFunc default）。
        alias:
          type: string
          description: omitempty：结果列别名，缺省时后端用 field 原名（ResolveAlias）。
    ChartPagination:
      type: object
      description: >-
        图表查询分页（entity.Pagination / query.Pagination，字段一致）。契约统一为
        limit/offset，page/page_size 是旧协议遗留：Batch 3 迁移到 limit/offset，
        当前实现仍以本对象为准，故字段保留并标记 deprecated。
      required:
        - page
        - page_size
      properties:
        page:
          type: integer
          deprecated: true
          description: 页码（从 1 开始）；executor 生成 OFFSET = (page-1)*page_size。
        page_size:
          type: integer
          deprecated: true
          description: 每页行数；executor 生成 LIMIT。0 会参与除零（total_pages），调用方须给正值。
    # ChartQueryRequest 字段级核对清单（旧协议，handler 绑定 entity.ChartQueryRequest）：
    #   entity.ChartQueryRequest   backend/internal/domain/entity/chart.go:15-23
    #     dataset_id  int            -> json "dataset_id"
    #     chart_type  string         -> json "chart_type"
    #     dims        []string       -> json "dims"
    #     metrics     []MetricConfig -> json "metrics"（chart.go:26-30: field / agg / alias(omitempty)）
    #     filters     []Filter       -> json "filters"（dataset.go:58-65: id / field / operator /
    #                                  value / value_end(omitempty) / logic；注意键是 operator）
    #     pagination  *Pagination    -> json "pagination"（chart.go:33-36: page / page_size）
    #     sort        *SortConfig    -> json "sort"（dataset.go:67-71: field / order）
    #   差异记录：查询层 query.ChartQueryRequest（internal/query/types.go:81-91）另有
    #   config.query_options.pie_merge_other_below_ratio（饼图长尾合并阈值），但 entity 层
    #   不含 config 字段、handler 也不解析，当前该请求字段整体被静默忽略（Batch 3 契约化）。
    ChartQueryRequest:
      type: object
      description: POST /api/charts/query 请求体（entity.ChartQueryRequest，旧协议）。
      required:
        - dataset_id
        - chart_type
        - metrics
      properties:
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: >-
            决定响应 data 形状：table -> ChartTableResponse；pie -> ChartPieResponse；
            bar/line/area 及未知 -> ChartAxisResponse；scatter -> ChartScatterResponse；
            pivot -> ChartPivotResponse。
        dims:
          type: array
          items:
            type: string
          description: 分组维度列；pie/axis 族取 dims[0] 作类目/X 轴，多余维度作 series 组合。
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricConfig'
          description: 指标数组；scatter 需至少 2 个指标（第 1 个为 X、第 2 个为 Y），空则 pie/axis 返回空形状。
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: 过滤条件（entity.Filter）；键为 operator（非 op），含前端未使用的 id 键。
        pagination:
          $ref: '#/components/schemas/ChartPagination'
        sort:
          $ref: '#/components/schemas/SortConfig'
    ChartDataResult:
      type: object
      description: >-
        POST /api/charts/query 的业务负载（entity.ChartDataResult，chart.go:39-43）。
        data 为查询处理器输出，oneOf 五形状（契约上按 chart_type 判别，见
        ChartQueryRequest.chart_type 映射；oneOf 成员在 pie/scatter/table 间存在结构
        重叠，消费方以 chart_type 为准，不做运行时判别）。data 成功时恒为非 null
        （response 归一化保证集合字段不为 null）。
      required:
        - data
      properties:
        data:
          description: >-
            查询处理器输出，形状由 chart_type 判别（oneOf 语义，成员见下方各 schema；
            为不引入 oapi-codegen runtime 依赖，Go 生成物为无类型 interface{}，
            消费方按 ChartQueryRequest.chart_type 手动判别，五成员为
            ChartTableResponse / ChartPieResponse / ChartAxisResponse /
            ChartScatterResponse / ChartPivotResponse）。
        select_sql:
          type: string
          description: 生成的取数 SQL（entity omitempty；成功路径恒非空）。
        count_sql:
          type: string
          description: >-
            生成的计数 SQL；仅 chart_type=table 且携带 pagination 分支返回
            （executor.Execute 的 count 查询路径），其余形状缺省。
    ChartTableResponse:
      type: object
      description: table 图表响应（query.TableResponse）。
      required:
        - columns
        - data
        - pagination
      properties:
        columns:
          type: array
          items:
            type: string
          description: 维度在前、指标别名在后（pagination 分支按 dims/metrics 顺序组装）。
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
        pagination:
          $ref: '#/components/schemas/ChartTablePagination'
    ChartTablePagination:
      type: object
      description: table 响应分页回显（query.TablePagination）。
      required:
        - page
        - page_size
        - total
        - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: 总行数；GROUP BY 场景取 count 结果行数而非求和。
        total_pages:
          type: integer
    ChartPieResponse:
      type: object
      description: pie 图表响应（query.PieResponse）。
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChartPieDataItem'
          description: 长尾超过 20 项时截断并合并为名为 "其他" 的条目。
        other:
          $ref: '#/components/schemas/ChartPieDataItem'
          description: Go 类型保留字段（omitempty）；当前处理器不产出，合并项直接进 data。
    ChartPieDataItem:
      type: object
      description: 饼图数据项（query.PieDataItem）。
      required:
        - name
        - value
        - percentage
      properties:
        name:
          type: string
        value:
          type: number
          format: double
        percentage:
          type: number
          format: double
          description: 百分比，保留两位小数；总值为 0 时恒为 0。
    ChartAxisResponse:
      type: object
      description: 坐标轴族响应 bar/line/area（query.AxisResponse）。
      required:
        - x_axis
        - series
      properties:
        x_axis:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChartAxisSeries'
    ChartAxisSeries:
      type: object
      description: 坐标轴系列数据（query.AxisSeries）。
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: 单维度时为指标别名；多维度为 "指标 - 维度组合"（仅多指标时加指标前缀）。
        data:
          type: array
          items: {}
          description: 与 x_axis 等长的值序列；空洞位置为 null（键存在但值缺失时）。
    ChartScatterResponse:
      type: object
      description: scatter 图表响应（query.ScatterResponse）；每点为 [x, y] 二元数组。
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double
    ChartPivotResponse:
      type: object
      description: pivot 图表响应（query.PivotResponse）；当前实现同 table 但不含分页。
      required:
        - columns
        - data
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
    Share:
      type: object
      description: >-
        分享响应实体（entity.Share，backend/internal/domain/entity/share.go）。
        password 为 json:"-" 永不外泄（bcrypt 哈希也不回显），has_password 是
        唯一的密码保护信号。
      required:
        - id
        - token
        - chart_id
        - expires_at
        - created_at
        - has_password
      properties:
        id:
          type: integer
        token:
          type: string
          description: 后端随机生成，格式 hex(8 字节)-hex(8 字节)，如 "3a7f...c2-9d1e...f0"。
        chart_id:
          type: integer
        expires_at:
          type: string
          nullable: true
          description: RFC3339 过期时间；指针字段，键恒在，无过期设置时为 null。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        has_password:
          type: boolean
          description: 是否设置了访问密码（替代外泄的 password 字段）。
    ShareCreateRequest:
      type: object
      description: POST /api/shares 请求体（handler 匿名 struct：chart_id/password/expires_at）。
      required:
        - chart_id
      properties:
        chart_id:
          type: integer
          description: 被分享的图表 ID；后端不校验其存在性。
        password:
          type: string
          writeOnly: true
          description: 访问密码；空串/缺省表示不设密码；非空以 bcrypt 哈希落库。
        expires_at:
          type: string
          description: >-
            RFC3339 过期时间；非 RFC3339 的字符串被后端解析失败后静默忽略
            （等同不设置过期）。
    ShareVerifyRequest:
      type: object
      description: POST /api/shares/{token}/verify 请求体。
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
          description: 待校验密码；无密码的分享恒通过。
    ChartListResponse:
      description: GET /api/charts 响应：data 为 Chart 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Chart'
    ChartResponse:
      description: 图表 CRUD 响应：data 为单个 Chart。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Chart'
    ChartDataRowsResponse:
      description: >-
        GET /api/charts/{id}/data 响应：data 为裸数据行数组（非 ChartDataResult）。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DataRow'
    ChartQueryResponse:
      description: POST /api/charts/query 响应：data 为 ChartDataResult。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ChartDataResult'
    ShareListResponse:
      description: GET /api/shares 响应：data 为 Share 数组（id 倒序，无分页）。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Share'
    ShareResponse:
      description: 分享 CRUD / verify 响应：data 为单个 Share。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Share'
    # ---- ChartSpec / QuerySpec：内部建模首版（backend/internal/query/chart_spec.go）----
    # 为 Batch 3 的 chart_spec 协议铺路。当前对外 API（POST /api/charts/query 请求体）
    # 仍是 ChartQueryRequest 旧字段；service 层经 query.ChartSpecFromRequest /
    # QuerySpecFromRequest 适配器把旧请求转成这两个规格后进入查询链路，
    # 因此本组 schema 不出现在任何 paths 的 requestBody/response 引用中。
    ChartSpec:
      type: object
      description: >-
        图表语义规格（query.ChartSpec:5）：表达图表实例绑定了什么字段和配置，
        属于 Chart 语义层，不直接生成 SQL。
      required:
        - chart_type
        - dimension_groups
        - metric_groups
      properties:
        chart_type:
          type: string
          description: table / bar / line / pie / area / scatter / pivot；未知值按 axis 回退。
        dimension_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartDimensionGroup'
          description: 旧协议 dims 映射为默认维度组（pivot=rows、pie=category、scatter=dims、其余=x_axis）。
        metric_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricGroup'
          description: 旧协议 metrics 映射为默认指标组 values。
        style:
          type: object
          additionalProperties: true
          description: 视觉样式扩展袋（Go map[string]any，omitempty）；当前 adapter 输出空对象。
        query_options:
          type: object
          additionalProperties: true
          description: 查询选项扩展袋（Go map[string]any，omitempty），如饼图长尾合并阈值。
    ChartDimensionGroup:
      type: object
      description: 维度组（query.DimensionGroup）。
      required:
        - name
        - label
        - fields
      properties:
        name:
          type: string
          description: 组标识，如 x_axis / rows / columns / category。
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChartDimensionField'
    ChartDimensionField:
      type: object
      description: 维度字段绑定（query.DimensionField）。
      required:
        - field
      properties:
        field:
          type: string
        label:
          type: string
        granularity:
          type: string
          description: 时间粒度（day / week / month 等）；执行前按方言校验（ValidateGranularity）。
    ChartMetricGroup:
      type: object
      description: 指标组（query.MetricGroup）。
      required:
        - name
        - label
        - fields
      properties:
        name:
          type: string
          description: 组标识，如 values / primary_values / secondary_values。
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricField'
    ChartMetricField:
      type: object
      description: 指标字段绑定（query.MetricField）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
        label:
          type: string
        agg:
          type: string
          description: sum / avg / count / max / min（query.AggregationType）。
        alias:
          type: string
        unit:
          type: string
        format:
          type: string
    QuerySpec:
      type: object
      description: >-
        查询语义规格（query.QuerySpec:46）：表达"查什么"，不含视觉语义，
        由 ChartSpec/旧请求转换而来，是 BunQueryBuilder 的上游输入。
      required:
        - dimensions
        - metrics
        - filters
      properties:
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionExpr'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricExpr'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterConfig'
        sort:
          $ref: '#/components/schemas/SortConfig'
        pagination:
          $ref: '#/components/schemas/ChartPagination'
        limit:
          type: integer
          description: 行数上限（Go omitempty，0 不出现在序列化 JSON）。
    DimensionExpr:
      type: object
      description: 结构化维度表达式（query.DimensionExpr）。
      required:
        - field
      properties:
        field:
          type: string
        label:
          type: string
        granularity:
          type: string
    MetricExpr:
      type: object
      description: 结构化指标表达式（query.MetricExpr2；命名避开 ast.go 的 MetricExpr）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
        agg:
          type: string
          description: sum / avg / count / max / min（query.AggregationType）。
        alias:
          type: string
        unit:
          type: string
        format:
          type: string
    FilterConfig:
      type: object
      description: >-
        查询层过滤条件（query.FilterConfig）：JSON 键是 op，与旧协议 entity.Filter
        的 operator 不同；Batch 3 chart_spec 协议统一采用本形状。
      required:
        - field
        - op
        - value
        - logic
      properties:
        field:
          type: string
        op:
          type: string
          description: >-
            eq / neq / gt / gte / lt / lte / like / in / between / isNull / isNotNull；
            未知值后端按 "=" 回退（FilterOperator.ToString default）。
        value: {}
        value_end: {}
          # query.FilterConfig.ValueEnd interface{} omitempty：between 上界，任意 JSON 值
        logic:
          type: string
          description: 与其他条件的连接逻辑（如 "and" / "or"）。
  parameters:
    DatasourceId:
      name: id
      in: path
      required: true
      description: 数据源 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    DatasetId:
      name: id
      in: path
      required: true
      description: 数据集 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    ChartId:
      name: id
      in: path
      required: true
      description: 图表 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    ShareToken:
      name: token
      in: path
      required: true
      description: >-
        分享 token（gin 通配符 :token）；后端生成格式 hex(8B)-hex(8B)，
        API 层按不透明字符串处理。
      schema:
        type: string
    TableName:
      name: table
      in: path
      required: true
      description: >-
        表名；spec 占位符 {table} 与 gin 通配符 `:table` 对应，须为合法标识符，
        前端以 URL 编码传输。
      schema:
        type: string

