# Data Insights API 契约（单一权威来源）
#
# 修改接口时：先改本文件 → `make api-gen` 双端重新生成 → 双端消费生成物。
# 禁止直接编辑生成物（backend/internal/idls/gen_types.go、frontend/src/idls/gen_types.ts）。
openapi: 3.0.3
info:
  title: Data Insights API
  description: |
    拖拽式 BI 可视化分析平台 API。

    ## 响应契约
    所有端点（含 /health）HTTP 状态码恒为 200；业务结果由响应体 Envelope 表达：
    `{ code, msg, trace, data }`。code 枚举与
    `backend/internal/response/response.go` 的常量一一对应
    （20000 成功，20100–20500 客户端/业务错误，50000 服务端内部错误）。

    data 在错误或无数据时统一归一化为空对象 `{}` / 空数组 `[]`，不会出现 null。
  version: 0.1.0
servers:
  - url: http://localhost:23352
    description: 本地开发后端
tags:
  - name: health
    description: 健康检查（响应 Envelope 建模样例）
  - name: datasources
    description: 数据源管理（CRUD、连接测试、库表元数据、预览与字段分布）
  - name: datasets
    description: 数据集管理（CRUD、列定义、预览、查询）
  - name: charts
    description: 图表管理（CRUD、数据集取数预览、图表语义查询）
  - name: shares
    description: 分享管理（创建、列表、详情、密码校验）与公开视图跳转
  - name: queries
    description: 查询记录（地址栏即分享：落库去重与短码寻址）
  - name: dashboards
    description: >-
      仪表盘管理（12 列栅格容器的 CRUD、软删，以及图表侧的「被多少个仪表盘引用」计数，
      和批量取数端点 POST /api/dashboards/{id}/query）。
  - name: dashboard-folders
    description: >-
      仪表盘文件夹（树结构归档：多层嵌套 + 软删）。第一期只归档仪表盘，不归档图表。
paths:
  /health:
    get:
      tags:
        - health
      summary: 健康检查
      description: 样例端点，验证统一响应 Envelope 的契约建模。
      operationId: getHealth
      responses:
        '200':
          description: HTTP 恒 200；服务健康由 Envelope.code = 20000 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/datasources:
    get:
      tags:
        - datasources
      summary: 数据源列表
      description: |
        分页返回数据源数组；无结果时 data 为空数组（handler 将 nil 归一化为 []）。
      operationId: listDatasources
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            每页条数。后端 getPaginationParams（handler/helpers.go）：缺省 100；
            值 ≤0 或 >1000 时回落为 100（实际硬上限是 1000）。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceListResponse'
    post:
      tags:
        - datasources
      summary: 创建数据源
      description: |
        type 为空时后端缺省填 "postgresql"。响应 data 为创建后的 Datasource，
        不含 password（entity 的 Password 为 json:"-"）。
      operationId: createDatasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
  /api/datasources/test:
    post:
      tags:
        - datasources
      summary: 测试数据源连接
      description: |
        使用未落库的连接参数测试连通性。type 为空时后端缺省填 "postgresql"；
        不支持的驱动类型或连接失败返回 Envelope.code = 20100（BadRequest）。
      operationId: testDatasourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceTestConnectionRequest'
      responses:
        '200':
          description: 'HTTP 恒 200；连接成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasources/{id}:
    get:
      tags:
        - datasources
      summary: 获取数据源详情
      operationId: getDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
    put:
      tags:
        - datasources
      summary: 更新数据源
      description: |
        password 为空字符串或缺省表示保留数据库中已存密码（service.Update 明确
        保留原值），因此响应永远不回显密码。
      operationId: updateDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Datasource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceResponse'
    delete:
      tags:
        - datasources
      summary: 删除数据源
      operationId: deleteDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasources/{id}/tables:
    get:
      tags:
        - datasources
      summary: 列出数据源下的表
      description: 实时连接目标数据源读取表元数据；返回 TableInfo 数组。
      operationId: listDatasourceTables
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
  /api/datasources/{id}/tables/{table}/columns:
    get:
      tags:
        - datasources
      summary: 列出表的列元数据
      description: |
        {table} 与 gin 路由 `:table` 通配符对应；表名必须是合法标识符，
        前端调用时做 URL 编码。handler 以 map 组装，仅含 name/data_type/comment 三个键。
      operationId: listTableColumns
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
        - $ref: '#/components/parameters/TableName'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnListResponse'
  /api/datasources/{id}/tables/{table}/data:
    get:
      tags:
        - datasources
      summary: 分页读取表数据
      description: |
        {table} 与 gin 路由 `:table` 通配符对应。sort_field 缺省用第一个主键列，
        且必须是主键列之一；sort_order 按大小写不敏感匹配 desc，其余一律归一为 ASC。
      operationId: getTableData
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
        - $ref: '#/components/parameters/TableName'
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始；≤0 被后端归一为 1。
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: 每页行数；≤0 归一为 20，上限 100（超出截断为 100）。
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort_field
          in: query
          required: false
          description: 排序列；必须是该表的主键列，否则返回 Envelope.code = 50000（错误消息含 "sort field must be a primary key"）。
          schema:
            type: string
        - name: sort_order
          in: query
          required: false
          description: 排序方向，ASC/DESC（大小写不敏感）；缺省 ASC。
          schema:
            type: string
            default: ASC
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataResponse'
  /api/datasources/{id}/preview:
    post:
      tags:
        - datasources
      summary: 预览数据源表或 SQL 结果
      description: |
        query_type = "table" 时以 table_name（合法标识符）为源；query_type = "sql" 时以
        query_sql 为源（包成子查询）。后端固定取前 10 行。两源字段按 query_type 二选一，
        因此 schema 不强制 required。
      operationId: previewDatasource
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcePreviewRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcePreviewResponse'
  /api/datasources/{id}/field-distribution:
    post:
      tags:
        - datasources
      summary: 字段值分布统计
      description: |
        field_name 必填（缺失返回 Envelope.code = 20100）。limit ≤0 或 >50 时后端归一为 20。
        数据源/查询源的解析规则与 preview 端点一致。
      operationId: getDatasourceFieldDistribution
      parameters:
        - $ref: '#/components/parameters/DatasourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDistributionRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDistributionResponse'
  /api/datasets:
    get:
      tags:
        - datasets
      summary: 数据集列表
      description: |
        分页返回数据集数组；无结果时 data 为空数组。分页参数与数据源列表一致
        （limit 缺省 100、offset 缺省 0，helpers.go 对 ≤0 或 >1000 回落 100）。
      operationId: listDatasets
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数；缺省 100，≤0 或 >1000 后端回落为 100。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
    post:
      tags:
        - datasets
      summary: 创建数据集
      description: |
        tags/columns 是 JSON 数组的字符串形态（后端以 string 存储，非数组）；
        query_type 为空后端填 "table"，mode 为空填 "direct"，tags/columns 为空填 "[]"。
        table_name 与 query_sql 按 query_type 二选一，未传的置为 null。
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
  /api/datasets/{id}:
    get:
      tags:
        - datasets
      summary: 获取数据集详情
      operationId: getDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
    put:
      tags:
        - datasets
      summary: 更新数据集
      description: |
        PUT /api/datasets/:id：id 走路径，请求体与 DatasetCreateRequest 同构
        （tags/columns/shard_keys 为 JSON 数组的字符串形态，非数组本体）。
        取回并保留（fetch-and-preserve）：service.Update 为整行更新，handler 以
        现有行为合并基——query_type/mode 为空缺省 "table"/"direct"，name/datasource_id/
        shard_enabled 恒取自请求体；未传或为空的 tags/columns/shard_keys 与指针字段
        table_name/query_sql/description 保留库中现值，显式 "[]" 仍可清空；
        quality_rules/accelerate_config/refresh_strategy/preview_data/
        created_at/updated_at 不在体内、恒保留。
        未知 id 返回与 GET 相同的 20300 信封（handler 先 GetByID 门控，避免
        service.Update 全行更新对缺失行报出误导性的内部错误）。
      operationId: updateDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Dataset；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
    delete:
      tags:
        - datasets
      summary: 删除数据集
      operationId: deleteDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/datasets/{id}/columns:
    get:
      tags:
        - datasets
      summary: 获取数据集列定义
      description: 返回 DatasetColumn 数组（数据集 columns JSON 字段解析后的列定义）。
      operationId: getDatasetColumns
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetColumnListResponse'
    post:
      tags:
        - datasets
      summary: 更新数据集列定义
      description: |
        请求体是 DatasetColumn 裸数组（不是 {columns: [...]} 包装对象）。
        成功 data 为更新后的 Dataset（columns 字段已写回）。
      operationId: updateDatasetColumns
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DatasetColumn'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
  /api/datasets/{id}/preview:
    get:
      tags:
        - datasets
      summary: 预览数据集数据
      description: 按数据集的表/SQL 源实时取数（后端固定取前 10 行）；data 为 PreviewResult。
      operationId: previewDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPreviewResponse'
  /api/datasets/{id}/query:
    post:
      tags:
        - datasets
      summary: 按 QueryConfig 查询数据集
      description: |
        请求体为 entity.QueryConfig（维度组/指标组/过滤/排序/limit）；
        data 为查询结果行数组，每行是列名到任意 JSON 值的映射。
      operationId: queryDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryConfig'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQueryResponse'
  /api/charts:
    get:
      tags:
        - charts
      summary: 图表列表
      description: |
        分页返回图表数组；无结果时 data 为空数组（handler 将 nil 归一化为 []）。
        分页参数与数据源/数据集列表一致（helpers.go getPaginationParams：
        limit 缺省 100、≤0 或 >1000 回落 100；offset 缺省 0、负数归一为 0）。
      operationId: listCharts
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数；缺省 100，≤0 或 >1000 后端回落为 100。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartListResponse'
    post:
      tags:
        - charts
      summary: 创建图表
      description: |
        config 是 JSON 文档的字符串形态（后端以 string 存储，非对象）；为空时
        后端缺省填 "{}"。chart_type 与 dataset_id 后端不做存在性/枚举强校验
        （无效 dataset_id 要到取数时才暴露）；name/dataset_id/chart_type 为
        规范性收紧的 required（后端 ShouldBindJSON 零值可过，见 task-3 报告）。
      operationId: createChart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
  /api/charts/{id}:
    get:
      tags:
        - charts
      summary: 获取图表详情
      operationId: getChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: HTTP 恒 200；不存在或 id 非法时 Envelope.code = 20300/20100，data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
    put:
      tags:
        - charts
      summary: 更新图表
      description: |
        PUT 为全量覆盖：请求体绑定 {name, dataset_id, chart_type, config} 四字段，
        未提供的字段以零值写库（不是增量合并）。config 缺省/空串被后端替换为 "{}"。
        成功 data 为更新后回读的 Chart。
      operationId: updateChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
    delete:
      tags:
        - charts
      summary: 删除图表
      operationId: deleteChart
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/charts/{id}/data:
    get:
      tags:
        - charts
      summary: 图表数据预览取数
      description: |
        按图表持久化 config 实时取数（service/chart.GetData）。v1 文档（query 键 +
        非空维度/指标组）复用 POST /api/charts/query 的同一聚合管道：dims 平铺
        dimensionGroups.fields、metrics 平铺 metricGroups.fields（agg/alias 取
        fieldMeta，默认 sum/列名），filters/sort/limit 透传，响应 data 为与
        ChartDataResult.data 相同的判别形状（ChartTableResponse / ChartPieResponse /
        ChartAxisResponse / ChartScatterResponse / ChartPivotResponse；不投影
        select_sql/count_sql）。旧结构（queryConfig + 位置 field-N）、损坏 JSON、
        空配置或组全空时回退为按数据集源取前 100 行的裸数据行数组（DataRow[]，
        query.WrapPreviewSQL，列名不可恢复）。图表/数据集不存在、取数失败 →
        Envelope.code = 50000（handler.GetData 走 InternalError，不区分 404）；
        {id} 非法 → 20100（与 ChartId 参数口径一致）。
      operationId: getChartData
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDataResponse'
  /api/charts/query:
    post:
      tags:
        - charts
      summary: 图表语义查询（v1 平铺 / v2 槽位协议，spec_version 判别）
      description: |
        请求体为 ChartSpecQueryRequest（entity.ChartQueryRequest 超集，同一 schema 描述
        v1/v2 两种协议）：spec_version 缺失或 !=2 时走 v1 平铺协议（dims/metrics，
        形状同 ChartQueryRequest）；spec_version=2 时走 v2 槽位协议
        （dimension_groups/metric_groups，槽位名与 binding_id 保留进查询 AST）。
        成功 data 为 ChartDataResult：{ data, select_sql, count_sql }，其中 data 的
        形状由 chart_type 决定（table/pie/axis/scatter 四族，另加 pivot，详见
        ChartDataResult 描述）。select_sql 成功时恒返回；count_sql 仅 table +
        pagination 分支返回。执行失败统一 Envelope.code = 50000。
      operationId: queryChart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartSpecQueryRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartQueryResponse'
  /api/charts/{id}/references:
    get:
      tags:
        - charts
      summary: 图表被仪表盘引用计数
      description: |
        返回引用了该图表的未软删仪表盘（含总数与 id/name 列表），供删除图表前的
        「该图表被 N 个仪表盘引用」提示。**提示不阻断删除**（PRD D2 / R-75）。

        判定方式是 layout_json 的 jsonb 存在性查询（`@?` + jsonpath），逐块匹配
        widgets[*].chartId，配合 idx_dashboard_layout_gin（jsonb_path_ops）索引；
        绝不用文本子串匹配。

        路由挂在 charts 分组（资源归属方是图表），实现由 dashboard handler 提供，
        因为它扫的是 bi_dashboard 表。{id} 非法 → 20100。
      operationId: listChartReferences
      parameters:
        - $ref: '#/components/parameters/ChartId'
      responses:
        '200':
          description: 'HTTP 恒 200；无引用时 data 为 {count: 0, dashboards: []}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartReferenceResponse'
  /api/dashboards:
    get:
      tags:
        - dashboards
      summary: 仪表盘列表
      description: |
        分页返回未软删仪表盘（`deleted_at IS NULL`），按 `created_at DESC, id DESC`
        排序（与迁移 00005 的 partial 索引 idx_dashboard_not_deleted 同口径）。
        无结果时 data 为空数组。

        分页参数与数据源/数据集/图表列表一致（limit 缺省 100、≤0 或 >1000 回落 100；
        offset 缺省 0、负数归一为 0）。
      operationId: listDashboards
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数；缺省 100，≤0 或 >1000 后端回落为 100。
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: 偏移量；缺省 0，负数被后端归一化为 0。
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardListResponse'
    post:
      tags:
        - dashboards
      summary: 创建仪表盘
      description: |
        id 由后端生成（UUIDv7 字符串，非自增；见迁移 00005 与 PRD §6.5），请求体
        不接受 id。status 缺省 `draft`，layout_json 缺省 `{"version":1,"widgets":[]}`。

        校验：layout_json 非空且不是合法 JSON → 20100（列是 JSONB，否则会以 500
        的形式从 PostgreSQL 冒出来）；name 只受列宽（VARCHAR(255)）约束，后端不做
        非空强校验。
      operationId: createDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/dashboards/{id}:
    get:
      tags:
        - dashboards
      summary: 获取仪表盘详情
      description: |
        返回实体，layout_json 是布局文档的字符串形态（列是 JSONB，API 面是 string）。
        id 非法（非 UUID）→ 20100；不存在或已软删 → 20300。
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
    put:
      tags:
        - dashboards
      summary: 更新仪表盘（未提供的字段保留存量）
      description: |
        请求体四个字段（name/description/layout_json/status）**全部可选**：缺省或
        null 表示保留存量值，不是清零——与本仓库 datasource 密码、dataset 可选
        元数据的「未提供则保留」约定一致（AGENTS.md）。显式空串会写空串
        （description 的空串落库为 NULL，这是它唯一可达的「清空」形态）。

        updated_at 由后端显式前进（表无触发器），created_at 不变。
        layout_json 的校验与创建一致；id 非法 → 20100，不存在/已软删 → 20300。
      operationId: updateDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为更新后的 Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
    delete:
      tags:
        - dashboards
      summary: 删除仪表盘（软删）
      description: |
        软删：只打 `deleted_at = now()`，**绝不物理删除**，且幂等（重复删除影响 0 行
        不报错）。仪表盘是引用图的叶子，**无级联目标**（PRD §6.4）：它引用的图表
        一行都不动，正在引用它的别的东西也不存在。
      operationId: deleteDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/dashboards/{id}/query:
    post:
      tags:
        - dashboards
      summary: 仪表盘批量取数
      description: |
        按 layout_json 逐块取数，并在后端完成盘级筛选与图表自身筛选的合并
        （PRD §6.3 / §8.3 / R-74）：运行期覆盖 + 追加，**绝不写回
        bi_chart.config**；前端不解析 chart config、不下发合并结果。

        - 请求 filters 是筛选器取值的唯一真相源：请求里没出现的筛选器一律视为
          未激活（**不回落 layout 的 defaultValue**），未激活不参与合并不触发覆盖。
        - 适用条件是 (binding.datasetId, binding.column) 命中该图表的数据集
          （PRD §11-2 的二元组口径），避免跨数据集同名字段静默误伤。
        - 逐块返回结果，单块失败不整盘失败（该块 status = error 并带 message）。
        - 图表不存在 / 已软删的块不取数，分别返回 status = chart_missing /
          chart_deleted，且**保留该 widget 的 x/y/w/h 原位**（PRD D2），
          由前端渲染占位块。
        - layout_json 归前端所有：后端只做防御性投影读取，解析不出的布局返回空
          results 而不是报错。
      operationId: queryDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardQueryRequest'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data.results 为逐块结果数组（顺序与 layout 的图表块一致）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryResponse'
  /api/dashboard-folders:
    get:
      tags:
        - dashboard-folders
      summary: 仪表盘文件夹列表（扁平，前端按 parent_id 组树）
      description: |
        返回全部未软删文件夹（`deleted_at IS NULL`），按 `created_at ASC, id ASC` 排序
        （建树先序稳定）。**不做服务端组树**：树由前端用 parent_id 折叠，后端只回扁平数组。

        根级以 `parent_id = null` 表达。无结果时 data 为空数组。
        第一期不分页（归档量级小），也不支持按 parent_id 过滤。
      operationId: listDashboardFolders
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardFolderListResponse'
    post:
      tags:
        - dashboard-folders
      summary: 新建仪表盘文件夹
      description: |
        id 由后端生成 UUIDv7。parent_id 缺省 / null 表示根级；传 `""`（空串）同样表示
        **根级**——这是 PUT 侧「移动回根」哨兵（见 updateDashboardFolder）在本端点的镜像，
        创建时两者等价，都是「无父级」。

        parent_id 指向的文件夹必须存在且未软删，否则 20300。name 为空 → 20100。
      operationId: createDashboardFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardFolderCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardFolderResponse'
  /api/dashboard-folders/{id}:
    get:
      tags:
        - dashboard-folders
      summary: 获取仪表盘文件夹详情
      description: |
        id 非法（非 UUID）→ 20100；不存在或已软删 → 20300。
      operationId: getDashboardFolder
      parameters:
        - $ref: '#/components/parameters/DashboardFolderId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardFolderResponse'
    put:
      tags:
        - dashboard-folders
      summary: 更新文件夹（改名 / 移动；未提供的字段保留存量）
      description: |
        两个字段**全部可选且遵循「未提供则保留」**（与本仓库 dashboard / datasource 同例）：
        - `name`：缺省或 null 保留存量；空串 → 20100。
        - `parent_id`：**三态**。
          - 缺省或 `null` = 保留现有父级（只改名时前端就发这一形态）。
          - `""`（空串）= **移到根级**（清空父级）。这是 JSON 无法区分「缺省」与「null」
            时的显式哨兵，是本仓库唯一的字符串哨兵，前后端都按此口径实现。
          - UUID = 移到该文件夹下。

        守卫（都返回业务错误，不落库）：
        - 目标父级不存在或已软删 → 20300。
        - 把文件夹移动到自己或自己的**任意后代**下（环）→ 20400。
      operationId: updateDashboardFolder
      parameters:
        - $ref: '#/components/parameters/DashboardFolderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardFolderUpdateRequest'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardFolderResponse'
    delete:
      tags:
        - dashboard-folders
      summary: 删除仪表盘文件夹（软删，仅空夹可删）
      description: |
        软删：只打 `deleted_at = now()`，幂等（重复删除影响 0 行不报错）。

        **第一期采用「仅空夹可删」策略**：文件夹下仍有未软删的**子文件夹**或**仪表盘**
        时返回 20400 业务错误（消息指出还有几项），绝不级联删子夹、也绝不把子项孤儿化。
        理由：删除是不可逆的用户动作，级联删仪表盘会连带销毁整份 layout_json 文档；
        而「移动子项」第一期没有批量端点。前端据此在删除前先提示用户清空。
      operationId: deleteDashboardFolder
      parameters:
        - $ref: '#/components/parameters/DashboardFolderId'
      responses:
        '200':
          description: 'HTTP 恒 200；成功 data 为 {status: "ok"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/shares:
    get:
      tags:
        - shares
      summary: 分享列表
      description: |
        返回全部分享（按 id 倒序），不支持分页参数（handler 不读取 limit/offset）。
        无结果时 data 为空数组。
      operationId: listShares
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListResponse'
    post:
      tags:
        - shares
      summary: 创建分享
      description: |
        后端生成随机 token（16 字节，格式 hex(8B)-hex(8B)）。password 非空时以
        bcrypt（cost 10）哈希落库；expires_at 必须是 RFC3339，格式非法被后端静默
        忽略（即不设置过期）。chart_id 不校验图表存在性。响应 data 为 Share，
        password 永不回显（json:"-"），密码保护状态经 has_password 暴露。
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreateRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为新建 Share（含 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /api/shares/{token}:
    get:
      tags:
        - shares
      summary: 按 token 获取分享详情
      description: |
        token 不存在时 Envelope.code = 20300（"share not found"）。不做密码校验、
        不校验过期（过期只在 GET /share/{token} 公开视图判断）。
      operationId: getShare
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /api/shares/{token}/verify:
    post:
      tags:
        - shares
      summary: 校验分享密码
      description: |
        校验通过后返回 Share（含 chart_id，供前端跳转取数）。无密码的分享恒通过。
        密码错误或分享不存在统一 Envelope.code = 20100（handler 走 BadRequest）。
        存储侧 bcrypt 校验；遗留明文比对成功后透明升级为 bcrypt 哈希。
      operationId: verifySharePassword
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVerifyRequest'
      responses:
        '200':
          description: HTTP 恒 200；校验通过 data 为 Share，失败 data = {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
  /share/{token}:
    get:
      tags:
        - shares
      summary: 公开分享视图（浏览器入口，302 跳转）
      description: |
        非 Envelope JSON 端点：成功返回 HTTP 302，Location 指向前端 hash 路由
        "/#/share/{token}"。密码保护不拦截本端点（密码校验走
        /api/shares/{token}/verify），有/无密码均 302。失败才返回 HTTP 200
        Envelope：分享不存在 code=20300；已过期 code=20400
        （"share link has expired"，按 expires_at RFC3339 与当前时间比较）。
      operationId: viewShare
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '302':
          description: 重定向到前端分享页面（唯一成功形态，无响应体）
          headers:
            Location:
              description: '前端 hash 路由 /#/share/{token}'
              schema:
                type: string
        '200':
          description: HTTP 200 仅出现在失败路径（20300 不存在 / 20400 已过期）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/queries:
    post:
      tags:
        - queries
      summary: 查询记录落库（内容 hash 去重）
      description: |
        每次成功查询后由前端调用：把当前完整查询配置（spec_json）落成一条记录并
        返回地址栏短码，复制地址栏即分享。

        去重：spec_hash = sha256("<dataset_id>\n" + 规范化 spec JSON) 上有唯一约束，
        同配置重复提交走 ON CONFLICT DO UPDATE，**复用原 query_id**，且只更新
        row_count / duration_ms —— spec、created_at、expires_at、hit_count 一概不动。
        因此「别人再查一次同样的条件」不会改变已分享链接的内容与有效期。

        expires_at 恒为 created_at + 90 天，NULL 表示永久；打开链接**不刷新**它。

        校验：dataset_id 缺失 → 20100；spec 非 JSON 或超 32KB → 20100；
        spec.v != 1 → 20100；spec.document 非 JSON 对象 → 20100；
        source_type 超过 50 字符 → 20100。落库失败 → 50000。
      operationId: saveQueryRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRecordSaveRequest'
      responses:
        '200':
          description: HTTP 恒 200；成功 data 为 QueryRecordSaved（地址栏短码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRecordSaveResponse'
  /api/queries/{q}:
    get:
      tags:
        - queries
      summary: 短码寻址还原（`?q=` 直链）
      description: |
        把地址栏短码（idcodec 的 21 位 base58，**不是**数据库里的 uuid 原文）
        还原成完整记录，供前端重建图表配置。

        短码长度/字符集非法 → 20100；解码成功但无此记录 → 20300。
        **已过期记录照常返回**（直链保活，条件 100% 还原），过期与否只经
        `expired` 字段告知，由界面决定提示文案。

        每次读取都会更新 hit_count（+1）与 last_accessed_at；这两项写失败只记
        日志，不影响本次读取成功。`expires_at` 不刷新。
      operationId: getQueryRecord
      parameters:
        - $ref: '#/components/parameters/QueryShortId'
      responses:
        '200':
          description: HTTP 恒 200；业务结果由 Envelope.code 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRecordResponse'
components:
  schemas:
    ResponseCode:
      type: integer
      description: |
        业务状态码，与 backend/internal/response/response.go 常量一一对应。
      enum:
        - 20000
        - 20100
        - 20200
        - 20300
        - 20400
        - 20500
        - 50000
      x-enum-varnames:
        - CodeSuccess
        - CodeBadRequest
        - CodeUnauthorized
        - CodeNotFound
        - CodeBusinessError
        - CodeThirdPartyErr
        - CodeInternalError
    Envelope:
      type: object
      description: 统一响应封装；HTTP 状态码恒为 200，业务状态由 code 表达。
      required:
        - code
        - msg
        - trace
        - data
      properties:
        code:
          $ref: '#/components/schemas/ResponseCode'
        msg:
          type: string
          description: 提示消息；成功为 "success"，错误为可读错误描述
        trace:
          type: string
          description: 请求追踪 ID（X-Request-ID）
        data:
          description: 业务数据；错误或无数据时为空对象 {}，不为 null
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthResponse:
      description: GET /health 响应：Envelope 特化 data 为 HealthData。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    OkData:
      type: object
      description: 删除/测试连接等无业务负载端点的成功负载。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    OkResponse:
      description: 'Envelope 特化 data 为 OkData（{status: "ok"}）。'
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/OkData'
    Datasource:
      type: object
      description: |
        数据源响应实体（entity.Datasource）。password 为 json:"-" 永不外泄，
        因此本 schema 不含 password 字段。
      required:
        - id
        - name
        - type
        - host
        - port
        - database_name
        - username
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: >-
            驱动类型；后端 datasource.NewDriver 支持 postgresql / mysql /
            clickhouse / starrocks（创建时后端不做枚举强校验，落库什么返回什么）。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    DatasourceCreateRequest:
      type: object
      description: POST /api/datasources 请求体；password 仅出现在请求侧。
      required:
        - name
        - type
        - host
        - port
        - database_name
        - username
        - password
      properties:
        name:
          type: string
        type:
          type: string
          description: 为空时后端缺省填 "postgresql"。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: 连接密码；落库前 AES-GCM 加密（SECURITY_KEY）。
    DatasourceUpdateRequest:
      type: object
      description: |
        PUT /api/datasources/{id} 请求体。password 可缺省/空串：
        后端保留已存密码，不覆盖为空。
      required:
        - name
        - type
        - host
        - port
        - database_name
        - username
      properties:
        name:
          type: string
        type:
          type: string
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: 空字符串或缺省表示保留原密码。
    DatasourceTestConnectionRequest:
      type: object
      description: POST /api/datasources/test 请求体（无 name，不落库）。
      required:
        - type
        - host
        - port
        - database_name
        - username
        - password
      properties:
        type:
          type: string
          description: 为空时后端缺省填 "postgresql"。
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          writeOnly: true
    TableInfo:
      type: object
      description: 表元数据（entity.TableInfo）。
      required:
        - name
        - comment
      properties:
        name:
          type: string
        comment:
          type: string
    ColumnInfo:
      type: object
      description: >-
        列元数据；datasource handler 以 map 组装，仅含 name/data_type/comment
        三个键（前端手写的 role/is_virtual/expression 不由该端点返回）。
      required:
        - name
        - data_type
        - comment
      properties:
        name:
          type: string
        data_type:
          type: string
        comment:
          type: string
    DataRow:
      type: object
      additionalProperties: true
      description: 结果行：列名到任意 JSON 值的映射，值可能为 null。
    PreviewResult:
      type: object
      description: >-
        预览结果（entity.PreviewResult）；两字段经 response 归一化，
        恒为数组（不会为 null）。
      required:
        - columns
        - data
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
    TableDataResult:
      type: object
      description: >-
        分页表数据（entity.TableDataResult）；数组字段经归一化恒为数组，
        无主键时 primary_keys 为空数组。
      required:
        - columns
        - data
        - total
        - primary_keys
        - page
        - page_size
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
        total:
          type: integer
          format: int64
        primary_keys:
          type: array
          items:
            type: string
        page:
          type: integer
        page_size:
          type: integer
    DatasourcePreviewRequest:
      type: object
      description: >-
        POST /api/datasources/{id}/preview 请求体；table_name 与 query_sql 按
        query_type 二选一（"table" 用 table_name 且须为合法标识符，"sql" 用 query_sql），
        后端不做强校验，故均非 required。
      properties:
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: '"table" 或 "sql"；缺省/其他值按 table 分支处理。'
    FieldDistributionRequest:
      type: object
      description: POST /api/datasources/{id}/field-distribution 请求体。
      required:
        - field_name
      properties:
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: 数据源解析规则与 preview 一致。
        field_name:
          type: string
          description: 统计字段名；缺失时后端返回 20100。
        limit:
          type: integer
          description: 分布桶数上限；≤0 或 >50 后端归一为 20。
    FieldDistribution:
      type: object
      description: 字段值分布（entity.FieldDistribution）；distribution 恒为数组。
      required:
        - field_name
        - total_count
        - unique_count
        - distribution
      properties:
        field_name:
          type: string
        total_count:
          type: integer
          format: int64
        unique_count:
          type: integer
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/FieldValueCount'
    FieldValueCount:
      type: object
      description: 单个取值的计数与占比。
      required:
        - value
        - count
        - percentage
      properties:
        value: {}
        count:
          type: integer
          format: int64
        percentage:
          type: number
          format: double
          description: 百分比，保留两位小数（如 12.34）。
    Dataset:
      type: object
      description: >-
        数据集响应实体（entity.Dataset）。tags/columns/quality_rules/shard_keys 是
        JSON 文档的字符串形态；指针字段序列化时键恒在，值可为 null。
      required:
        - id
        - name
        - datasource_id
        - table_name
        - query_sql
        - query_type
        - mode
        - accelerate_config
        - description
        - tags
        - refresh_strategy
        - preview_data
        - quality_rules
        - columns
        - shard_enabled
        - shard_keys
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        datasource_id:
          type: integer
        table_name:
          type: string
          nullable: true
        query_sql:
          type: string
          nullable: true
        query_type:
          type: string
          description: '"table" 或 "sql"。'
        mode:
          type: string
          description: 当前后端语义为 "direct"（前端类型含 "accelerated"，后端不产出）。
        accelerate_config:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: string
          description: JSON 数组字符串，如 '["a","b"]'；缺省 "[]"。
        refresh_strategy:
          type: string
          nullable: true
        preview_data:
          type: string
          nullable: true
        quality_rules:
          type: string
          description: JSON 数组字符串；缺省 "[]"。
        columns:
          type: string
          description: DatasetColumn 数组的 JSON 字符串；缺省 "[]"。
        shard_enabled:
          type: boolean
        shard_keys:
          type: string
          description: 分片键的 JSON 数组字符串。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    DatasetCreateRequest:
      type: object
      description: >-
        POST /api/datasets 请求体。table_name/query_sql/description 未传或为空串时
        后端置为 null；query_type/mode 为空缺省 "table"/"direct"；tags/columns 为空
        缺省 "[]"。
      required:
        - name
        - datasource_id
        - query_type
      properties:
        name:
          type: string
        datasource_id:
          type: integer
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: '"table" 或 "sql"。'
        mode:
          type: string
          description: 为空时后端缺省 "direct"。
        description:
          type: string
        tags:
          type: string
          description: JSON 数组字符串（非数组本体）。
        columns:
          type: string
          description: DatasetColumn 数组的 JSON 字符串。
        shard_enabled:
          type: boolean
        shard_keys:
          type: string
          description: 分片键的 JSON 数组字符串。
    DatasetUpdateRequest:
      type: object
      description: >-
        PUT /api/datasets/{id} 请求体（id 走路径，不在体内）。与
        DatasetCreateRequest 同构，但为取回并保留语义：name/datasource_id/query_type
        必填恒覆盖（query_type/mode 为空缺省 "table"/"direct"）；可选字符串元数据
        tags/columns/shard_keys 及 table_name/query_sql/description 未传或为空串时
        保留库中现值（与 datasource.Update 省略 password 即保留同一约定），显式 "[]"
        仍可清空；quality_rules/created_at/updated_at 等体外的列恒保留不被覆盖。
      required:
        - name
        - datasource_id
        - query_type
      properties:
        name:
          type: string
        datasource_id:
          type: integer
        table_name:
          type: string
        query_sql:
          type: string
        query_type:
          type: string
          description: '"table" 或 "sql"。'
        mode:
          type: string
          description: 为空时后端缺省 "direct"。
        description:
          type: string
        tags:
          type: string
          description: JSON 数组字符串（非数组本体）。
        columns:
          type: string
          description: DatasetColumn 数组的 JSON 字符串。
        shard_enabled:
          type: boolean
        shard_keys:
          type: string
          description: 分片键的 JSON 数组字符串。
    DatasetColumn:
      type: object
      description: >-
        数据集列定义（entity.DatasetColumn）；JSON 字段名为 snake_case 的 type_config。
        id 是列的**稳定标识**（8 位 base36 短 ID，由后端分配后不再变化），name 是
        **可变的展示名**：图表配置、shard_keys 与查询请求一律引用 id，展示时才由
        id 解析回 name。列未落库时后端在首次读取时分配 id 并物化。
      required:
        - id
        - name
        - expr
        - type
        - type_config
        - comment
        - role
      properties:
        id:
          type: string
          description: 列的稳定标识；由后端分配，客户端只读回传，不可自行生成或改写。
        name:
          type: string
          description: 可变展示名。同一数据集内必须唯一（后端在 PUT /columns 校验）。
        expr:
          type: string
          description: SQL 表达式。物理列的 expr 即来源表列名，改展示名不应改动 expr。
        type:
          type: string
          enum: [float, integer, boolean, string, date, datetime, array, map]
          description: >-
            统一规范数据类型（8 类，与后端 model.StandardDataTypes 对齐）。
            历史词 number/json/unknown 由后端归一为 float/map/string，不再出现。
        type_config:
          $ref: '#/components/schemas/TypeConfig'
        comment:
          type: string
        role:
          type: string
          description: '"dimension" 或 "metric"。'
    TypeConfig:
      type: object
      description: 类型相关配置（entity.TypeConfig）。
      required:
        - precision
        - scale
      properties:
        precision:
          type: integer
        scale:
          type: integer
    QueryConfig:
      type: object
      description: >-
        POST /api/datasets/{id}/query 请求体（entity.QueryConfig）。
        所有字段可缺省（后端绑定零值）。
      properties:
        dimension_groups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        metric_groups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sort:
          $ref: '#/components/schemas/SortConfig'
        limit:
          type: integer
    FieldGroup:
      type: object
      description: 维度/指标字段组。
      required:
        - id
        - fields
      properties:
        id:
          type: string
        fields:
          type: array
          items:
            type: string
        alias:
          type: string
          description: omitempty：空值不会出现在请求 JSON 中。
    Filter:
      type: object
      description: 过滤条件。
      required:
        - id
        - field
        - operator
        - value
        - logic
      properties:
        id:
          type: string
        field:
          type: string
        operator:
          type: string
        value: {}
        value_end: {}
          # 后端为 interface{}（带 omitempty）：区间过滤上界，任意 JSON 值
        logic:
          type: string
          description: 与其他条件的连接逻辑（如 "and" / "or"）。
    SortConfig:
      type: object
      required:
        - field
        - order
      properties:
        field:
          type: string
        order:
          type: string
          description: '"asc" 或 "desc"。'
    DatasourceListResponse:
      description: GET /api/datasources 响应：data 为 Datasource 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Datasource'
    DatasourceResponse:
      description: 数据源 CRUD 响应：data 为单个 Datasource。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Datasource'
    TableListResponse:
      description: GET /api/datasources/{id}/tables 响应：data 为 TableInfo 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TableInfo'
    ColumnListResponse:
      description: GET /api/datasources/{id}/tables/{table}/columns 响应：data 为 ColumnInfo 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ColumnInfo'
    TableDataResponse:
      description: GET /api/datasources/{id}/tables/{table}/data 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TableDataResult'
    DatasourcePreviewResponse:
      description: POST /api/datasources/{id}/preview 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PreviewResult'
    FieldDistributionResponse:
      description: POST /api/datasources/{id}/field-distribution 响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/FieldDistribution'
    DatasetListResponse:
      description: GET /api/datasets 响应：data 为 Dataset 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Dataset'
    DatasetResponse:
      description: 数据集 CRUD / 列更新响应：data 为单个 Dataset。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Dataset'
    DatasetColumnListResponse:
      description: GET /api/datasets/{id}/columns 响应：data 为 DatasetColumn 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DatasetColumn'
    DatasetPreviewResponse:
      description: GET /api/datasets/{id}/preview 响应：data 为 PreviewResult。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PreviewResult'
    DatasetQueryResponse:
      description: POST /api/datasets/{id}/query 响应：data 为结果行数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DataRow'
    Chart:
      type: object
      description: |
        图表响应实体（entity.Chart，backend/internal/domain/entity/chart.go）。
        config 是 JSON 文档的字符串形态（后端以 string 存储，非对象）。
      required:
        - id
        - name
        - dataset_id
        - chart_type
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: >-
            后端不做强校验、落库什么返回什么。查询层已知取值：table / bar / line /
            pie / area / scatter / pivot；未知值按 axis 处理器回退
            （query.GetProcessor default 分支）。
        config:
          type: string
          description: 图表配置的 JSON 字符串；创建/更新为空时后端写 "{}"。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        updated_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
    ChartCreateRequest:
      type: object
      description: >-
        POST /api/charts 请求体。后端整体绑定 entity.Chart（created_at/updated_at
        不参与落库映射；id 会被 toChartModel 透传进 insert——传非零值有指定主键风险，
        故本 schema 不定义 id）；name/dataset_id/chart_type 为规范性收紧的 required
        （后端零值可过，见 task-3 报告）。
      required:
        - name
        - dataset_id
        - chart_type
      properties:
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: 已知取值见 Chart.chart_type；后端不做枚举校验。
        config:
          type: string
          description: JSON 字符串；缺省/空串后端填 "{}"。
    ChartUpdateRequest:
      type: object
      description: >-
        PUT /api/charts/{id} 请求体（handler 匿名 struct：name/dataset_id/
        chart_type/config）。全量覆盖语义：未提供的可填字段以零值写库。
      required:
        - name
        - dataset_id
        - chart_type
      properties:
        name:
          type: string
        dataset_id:
          type: integer
        chart_type:
          type: string
        config:
          type: string
          description: 缺省/空串被后端替换为 "{}"（覆盖原配置，非保留）。
    ChartMetricConfig:
      type: object
      description: 指标聚合配置（entity.MetricConfig，chart.go:26-30）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
        agg:
          type: string
          description: >-
            聚合函数：sum / avg / count / max / min / count_distinct；未知值后端按 SUM 回退
            （query.AggregationType.GetAggFunc default）。
        alias:
          type: string
          description: omitempty：结果列别名，缺省时后端用 field 原名（ResolveAlias）。
    ChartPagination:
      type: object
      description: >-
        图表查询分页（entity.Pagination / query.Pagination，字段一致）。契约统一为
        limit/offset，page/page_size 是旧协议遗留：Batch 3 迁移到 limit/offset，
        当前实现仍以本对象为准，故字段保留并标记 deprecated。
      required:
        - page
        - page_size
      properties:
        page:
          type: integer
          deprecated: true
          description: 页码（从 1 开始）；executor 生成 OFFSET = (page-1)*page_size。
        page_size:
          type: integer
          deprecated: true
          description: 每页行数；executor 生成 LIMIT。0 会参与除零（total_pages），调用方须给正值。
    # ChartQueryRequest 字段级核对清单（旧协议，handler 绑定 entity.ChartQueryRequest）：
    #   entity.ChartQueryRequest   backend/internal/domain/entity/chart.go:15-23
    #     dataset_id  int            -> json "dataset_id"
    #     chart_type  string         -> json "chart_type"
    #     dims        []string       -> json "dims"
    #     metrics     []MetricConfig -> json "metrics"（chart.go:26-30: field / agg / alias(omitempty)）
    #     filters     []Filter       -> json "filters"（dataset.go:58-65: id / field / operator /
    #                                  value / value_end(omitempty) / logic；注意键是 operator）
    #     pagination  *Pagination    -> json "pagination"（chart.go:33-36: page / page_size）
    #     sort        *SortConfig    -> json "sort"（dataset.go:67-71: field / order）
    #   历史断链已消除（Batch 3 Task 2）：查询层 query.ChartQueryRequest 曾有
    #   Config 字段（config.query_options.pie_merge_other_below_ratio，饼图长尾合并阈值），
    #   但本端点绑定的 entity.ChartQueryRequest 自始不含 config，该查询层字段从未被任何
    #   HTTP 路径赋值，executor 的读取分支为死代码，已随请求结构一并删除；前端亦不再
    #   发送 config。饼图合并能力保留为 query 层内部特性（PieProcessor.MergeOtherBelowRatio，
    #   仅程序内可达），按产品决策暂不接线到任何请求协议。
    ChartQueryRequest:
      type: object
      description: >-
        v1 平铺协议请求体形状（entity.ChartQueryRequest 的 v1 字段子集）。
        POST /api/charts/query 现绑定其超集 ChartSpecQueryRequest；本 schema
        保留作 v1 形状的文档参考（frontend api/index.ts 仍以其为类型打底），
        不再被任何 path 直接引用。
      required:
        - dataset_id
        - chart_type
        - metrics
      properties:
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: >-
            决定响应 data 形状：table -> ChartTableResponse；pie -> ChartPieResponse；
            bar/line/area 及未知 -> ChartAxisResponse；scatter -> ChartScatterResponse；
            pivot -> ChartPivotResponse。
        dims:
          type: array
          items:
            type: string
          description: 分组维度列；pie/axis 族取 dims[0] 作类目/X 轴，多余维度作 series 组合。
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricConfig'
          description: 指标数组；scatter 需至少 2 个指标（第 1 个为 X、第 2 个为 Y），空则 pie/axis 返回空形状。
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: 过滤条件（entity.Filter）；键为 operator（非 op），含前端未使用的 id 键。
        pagination:
          $ref: '#/components/schemas/ChartPagination'
        sort:
          $ref: '#/components/schemas/SortConfig'
    # ChartSpecQueryRequest：POST /api/charts/query 请求体（v1/v2 超集）。
    # 与 handler 的 chartQueryIn / entity.ChartQueryRequest 对称（裁定2：同一个超集
    # struct 承载两种协议，不是两个独立 schema 竞争同一路由）。
    ChartSpecQueryRequest:
      type: object
      description: >-
        POST /api/charts/query 请求体（entity.ChartQueryRequest 超集，同一 schema
        描述 v1/v2 两种协议，按 spec_version 判别）。spec_version 缺失或 !=2：
        v1 平铺协议，消费 dims/metrics（形状同 ChartQueryRequest）；spec_version=2：
        v2 槽位协议，消费 dimension_groups/metric_groups（槽位名与 binding_id
        经 ChartSpecFromRequestV2 保留进 QuerySpec/QueryAST）。filters/pagination/sort
        两协议共用。
      required:
        - dataset_id
        - chart_type
      properties:
        dataset_id:
          type: integer
        chart_type:
          type: string
          description: >-
            决定响应 data 形状：table -> ChartTableResponse；pie -> ChartPieResponse；
            bar/line/area 及未知 -> ChartAxisResponse；scatter -> ChartScatterResponse；
            pivot -> ChartPivotResponse；histogram -> ChartHistogramResponse。
        spec_version:
          type: integer
          description: 协议版本判别键；v2 路径必填且值为 2，缺失或其他值按 v1 平铺协议处理。
        dims:
          type: array
          items:
            type: string
          description: v1 平铺维度列（spec_version 缺失或 !=2 时使用）。
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricConfig'
          description: v1 平铺指标数组（spec_version 缺失或 !=2 时使用）。
        dimension_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartDimensionGroup'
          description: v2 维度槽位组（spec_version=2 时使用）；name 为槽位名（x_axis / color_group / rows 等）。
        metric_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricGroup'
          description: v2 指标槽位组（spec_version=2 时使用）；name 为槽位名（values / primary_values 等）。
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: 过滤条件（entity.Filter）；键为 operator（非 op），v1/v2 共用。
        pagination:
          $ref: '#/components/schemas/ChartPagination'
        sort:
          $ref: '#/components/schemas/SortConfig'
        query_options:
          type: object
          additionalProperties: true
          description: >-
            查询选项扩展袋（entity/query.ChartQueryRequest.QueryOptions，Go
            map[string]any omitempty，Task 3-1a 接线）：histogram 读取 bin_count
            （数值，默认 20）与 bin_width（数值，可选；指定则覆盖 bin_count 推算的
            宽度）。executor 从请求结构体直接消费，不进入 QuerySpec/AST；其他
            chart_type 忽略本节。
    ChartDataResult:
      type: object
      description: >-
        POST /api/charts/query 的业务负载（entity.ChartDataResult，chart.go:39-43）。
        data 为查询处理器输出，是按 chart_type 判别的五形状（契约上 oneOf 语义、
        未生成 union 类型：data 为无类型 schema，成员见下方各 Chart*Response
        schema；pie/scatter/table 成员间存在结构重叠，消费方以 chart_type 为准，
        不做运行时判别）。data 成功时恒为非 null
        （response 归一化保证集合字段不为 null）。
      required:
        - data
      properties:
        data:
          description: >-
            查询处理器输出，形状由 chart_type 判别（oneOf 语义，成员见下方各 schema；
            为不引入 oapi-codegen runtime 依赖，Go 生成物为无类型 interface{}，
            消费方按 ChartQueryRequest.chart_type 手动判别，成员为
            ChartTableResponse / ChartPieResponse / ChartAxisResponse /
            ChartScatterResponse / ChartPivotResponse / ChartHistogramResponse
            （histogram，Task 3-1a））。
        select_sql:
          type: string
          description: 生成的取数 SQL（entity omitempty；成功路径恒非空）。
        count_sql:
          type: string
          description: >-
            生成的计数 SQL；仅 chart_type=table 且携带 pagination 分支返回
            （executor.Execute 的 count 查询路径），其余形状缺省。
    ChartTableResponse:
      type: object
      description: table 图表响应（query.TableResponse）。
      required:
        - columns
        - data
        - pagination
      properties:
        columns:
          type: array
          items:
            type: string
          description: >-
            仅 table + pagination 分支保证"维度在前、指标别名在后"（executor 按
            dims/metrics 顺序组装）；无 pagination 分支由 rows[0] 的 map 键遍历收集，
            顺序不保证。
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
        pagination:
          $ref: '#/components/schemas/ChartTablePagination'
    ChartTablePagination:
      type: object
      description: table 响应分页回显（query.TablePagination）。
      required:
        - page
        - page_size
        - total
        - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: 总行数；GROUP BY 场景取 count 结果行数而非求和。
        total_pages:
          type: integer
    ChartPieResponse:
      type: object
      description: pie 图表响应（query.PieResponse）。
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChartPieDataItem'
          description: 长尾超过 20 项时截断并合并为名为 "其他" 的条目。
        other:
          $ref: '#/components/schemas/ChartPieDataItem'
          description: Go 类型保留字段（omitempty）；当前处理器不产出，合并项直接进 data。
    ChartPieDataItem:
      type: object
      description: 饼图数据项（query.PieDataItem）。
      required:
        - name
        - value
        - percentage
      properties:
        name:
          type: string
        value:
          type: number
          format: double
        percentage:
          type: number
          format: double
          description: 百分比，保留两位小数；总值为 0 时恒为 0。
    ChartAxisResponse:
      type: object
      description: 坐标轴族响应 bar/line/area（query.AxisResponse）。
      required:
        - x_axis
        - series
      properties:
        x_axis:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChartAxisSeries'
    ChartAxisSeries:
      type: object
      description: 坐标轴系列数据（query.AxisSeries）。
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: 单维度时为指标别名；多维度为 "指标 - 维度组合"（仅多指标时加指标前缀）。
        data:
          type: array
          items: {}
          description: 与 x_axis 等长的值序列；空洞位置为 null（键存在但值缺失时）。
    ChartScatterResponse:
      type: object
      description: scatter 图表响应（query.ScatterResponse）；每点为 [x, y] 二元数组。
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double
    ChartPivotResponse:
      type: object
      description: pivot 图表响应（query.PivotResponse）；当前实现同 table 但不含分页。
      required:
        - columns
        - data
      properties:
        columns:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataRow'
    # ---- 预声明的后续任务响应形状（plan §3.2/§3.3/§3.4）----
    # 本组 schema 当前不被任何 processor 返回，仅为 Task 2-1（pivot v2）、
    # Task 3-1（histogram）、3-3（radar）、3-4/3-5（boxplot）、1-5（kpi）
    # 提前钉死字段名，避免各任务自行发明产生漂移。命名沿用 Chart*Response
    # 前缀约定，描述中注明对应的未来 query 包 Go struct。
    ChartPivotResponseV2:
      type: object
      description: >-
        透视表 v2 响应（plan §3.2 Go struct PivotResponse，Task 2-1 实现后替代
        ChartPivotResponse 的平铺形状）：交叉表头 + 含小计的数据行 + 可选合计行。
        当前仅声明，无 processor 返回。
      required:
        - row_headers
        - col_headers
        - metric_names
        - cells
        - grand_total
      properties:
        row_headers:
          type: array
          items:
            type: string
          description: 行维度列名。
        col_headers:
          type: array
          items:
            type: string
          description: 列维度值（交叉后的列）。
        metric_names:
          type: array
          items:
            type: string
          description: 指标别名。
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ChartPivotRow'
          description: 数据行（含小计行）。
        grand_total:
          allOf:
            - $ref: '#/components/schemas/ChartPivotRow'
          nullable: true
          description: 合计行；null 表示未请求（Go *PivotRow，键恒在）。
    ChartPivotRow:
      type: object
      description: 透视表 v2 数据行（plan §3.2 Go struct PivotRow）。
      required:
        - row_key
        - is_subtotal
        - values
      properties:
        row_key:
          type: array
          items:
            type: string
          description: 行维度值。
        is_subtotal:
          type: boolean
          description: 是否小计行。
        values:
          type: object
          additionalProperties:
            type: number
            format: double
          description: colHeader+metricAlias → 值。
    ChartHistogramResponse:
      type: object
      description: >-
        直方图响应（query.HistogramResponse，Task 3-1a 实现，R-57；2026-09-26 增加分组）。
        chart_type=histogram 时 ChartDataResult.data 的形状：两阶段分箱查询（阶段1
        MIN/MAX/COUNT → 阶段2 FLOOR((field-min)/bin_width) 分组计数）产出。bins 为
        补全后的完整连续分箱序列（无行的 bin 以 count=0 占位），sum(bins[].count) ==
        参与分箱的数值行数；空数据集返回 bins=[]。被分箱字段为 metrics[0].field
        （对该列的原始数值分箱计数，不做 SUM/AVG 聚合）；bin_count（默认 20）/
        bin_width 经请求的 query_options 传入。请求携带维度（v1 dims）时额外返回
        groups：每个维度值组合一个系列，各系列 bins 与顶层 bins 同长度同边界，
        顶层 bins 为跨系列总计数（sum(groups[].bins[].count) == bins[].count）。
      required:
        - bins
      properties:
        bins:
          type: array
          items:
            $ref: '#/components/schemas/ChartHistogramBin'
        groups:
          type: array
          description: >-
            分组直方图系列（query.HistogramGroup）。仅在请求携带维度时出现；
            name 为维度值组合（多维度用 " - " 连接，NULL 渲染为空串），按首次出现排序。
          items:
            $ref: '#/components/schemas/ChartHistogramGroup'
    ChartHistogramGroup:
      type: object
      description: 分组直方图的单个系列（query.HistogramGroup）：Name 为维度值组合，
        Bins 与顶层 bins 同长度同边界、只含该系列的计数。
      required:
        - name
        - bins
      properties:
        name:
          type: string
        bins:
          type: array
          items:
            $ref: '#/components/schemas/ChartHistogramBin'
    ChartHistogramBin:
      type: object
      description: >-
        直方图分箱（query.HistogramBin）。区间为 [bin_start, bin_end) 半开、
        相邻 bin 首尾相接（bin_end[i] == bin_start[i+1]）；等于最大值的边界行
        归入最后一个 bin（浮点边界钳制，末 bin 实际闭区间）。所有值相同的
        单值数据集产出单个 bin（宽度兜底 1，或用户 bin_width）。
      required:
        - bin_start
        - bin_end
        - count
      properties:
        bin_start:
          type: number
          format: double
        bin_end:
          type: number
          format: double
        count:
          type: integer
          format: int64
    ChartBoxplotResponse:
      type: object
      description: >-
        箱线图响应（plan §3.3 Go struct BoxplotResponse，Task 3-5 实现）。
        outliers 为展示截断（LIMIT 1000），outlier_total 为截断前总数。
        当前仅声明，无 processor 返回。
      required:
        - whisker_low
        - q1
        - median
        - q3
        - whisker_high
        - outliers
        - outlier_total
        - truncated
      properties:
        whisker_low:
          type: number
          format: double
        q1:
          type: number
          format: double
        median:
          type: number
          format: double
        q3:
          type: number
          format: double
        whisker_high:
          type: number
          format: double
        outliers:
          type: array
          items:
            type: number
            format: double
        outlier_total:
          type: integer
          format: int64
          description: 截断前的离群点总数。
        truncated:
          type: boolean
          description: outliers 是否被展示截断。
    ChartRadarResponse:
      type: object
      description: >-
        雷达图响应（plan §3.3 Go struct RadarResponse，Task 3-3 实现）。
        当前仅声明，无 processor 返回。
      required:
        - indicators
        - series
      properties:
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/ChartRadarIndicator'
          description: 维度值列表。
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChartRadarSeries'
    ChartRadarIndicator:
      type: object
      description: 雷达图指示器（plan §3.3 Go struct RadarIndicator）。
      required:
        - name
        - max
      properties:
        name:
          type: string
        max:
          type: number
          format: double
          description: 该维度的最大值（用于 ECharts radar indicator.max）。
    ChartRadarSeries:
      type: object
      description: 雷达图系列（plan §3.3 Go struct RadarSeries）。
      required:
        - name
        - values
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: number
            format: double
          description: 与 indicators 等长的值序列。
    ChartKpiResponse:
      type: object
      description: >-
        KPI 单值卡响应（plan §3.4 Go struct KpiResponse，Task 1-5 实现）。
        unit/format 为 Go omitempty，缺省时不出现在 JSON。当前仅声明，
        无 processor 返回。
      required:
        - value
        - label
      properties:
        value:
          type: number
          format: double
        label:
          type: string
        unit:
          type: string
        format:
          type: string
    Share:
      type: object
      description: >-
        分享响应实体（entity.Share，backend/internal/domain/entity/share.go）。
        password 为 json:"-" 永不外泄（bcrypt 哈希也不回显），has_password 是
        唯一的密码保护信号。
      required:
        - id
        - token
        - chart_id
        - expires_at
        - created_at
        - has_password
      properties:
        id:
          type: integer
        token:
          type: string
          description: 后端随机生成，格式 hex(8 字节)-hex(8 字节)，如 "3a7f...c2-9d1e...f0"。
        chart_id:
          type: integer
        expires_at:
          type: string
          nullable: true
          description: RFC3339 过期时间；指针字段，键恒在，无过期设置时为 null。
        created_at:
          type: string
          description: RFC3339 时间；数据库时间戳无效时为空字符串。
        has_password:
          type: boolean
          description: 是否设置了访问密码（替代外泄的 password 字段）。
    ShareCreateRequest:
      type: object
      description: POST /api/shares 请求体（handler 匿名 struct：chart_id/password/expires_at）。
      required:
        - chart_id
      properties:
        chart_id:
          type: integer
          description: 被分享的图表 ID；后端不校验其存在性。
        password:
          type: string
          writeOnly: true
          description: 访问密码；空串/缺省表示不设密码；非空以 bcrypt 哈希落库。
        expires_at:
          type: string
          description: >-
            RFC3339 过期时间；非 RFC3339 的字符串被后端解析失败后静默忽略
            （等同不设置过期）。
    ShareVerifyRequest:
      type: object
      description: POST /api/shares/{token}/verify 请求体。
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
          description: 待校验密码；无密码的分享恒通过。
    ChartListResponse:
      description: GET /api/charts 响应：data 为 Chart 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Chart'
    ChartResponse:
      description: 图表 CRUD 响应：data 为单个 Chart。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Chart'
    ChartDataResponse:
      description: >-
        GET /api/charts/{id}/data 响应：v1 配置时 data 为与 ChartDataResult.data
        相同的判别形状（契约上 oneOf 语义，成员为 ChartTableResponse /
        ChartPieResponse / ChartAxisResponse / ChartScatterResponse /
        ChartPivotResponse，按图表 chart_type 判别，不投影 select_sql/count_sql）；
        旧结构/损坏/空配置回退为裸 DataRow[]。生成物与 ChartDataResult.data 同理
        采用无类型 schema（Go interface{} / TS unknown），消费方判别。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              description: >-
                v1 配置为查询处理器输出（五形状之一，见上），legacy 回退为
                DataRow[]（经归一化恒为数组）。
    ChartQueryResponse:
      description: POST /api/charts/query 响应：data 为 ChartDataResult。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ChartDataResult'
    ShareListResponse:
      description: GET /api/shares 响应：data 为 Share 数组（id 倒序，无分页）。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Share'
    ShareResponse:
      description: 分享 CRUD / verify 响应：data 为单个 Share。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Share'
    # ---- ChartSpec / QuerySpec：内部建模（backend/internal/query/chart_spec.go）----
    # ChartSpecQueryRequest（POST /api/charts/query v2 协议）的 dimension_groups/
    # metric_groups 直接引用 ChartDimensionGroup/ChartMetricGroup；ChartSpec/QuerySpec
    # 本体仍是 service 层内部规格，不出现在任何 paths 的 requestBody/response 引用中。
    ChartSpec:
      type: object
      description: >-
        图表语义规格（query.ChartSpec:5）：表达图表实例绑定了什么字段和配置，
        属于 Chart 语义层，不直接生成 SQL。
      required:
        - chart_type
        - dimension_groups
        - metric_groups
      properties:
        chart_type:
          type: string
          description: table / bar / line / pie / area / scatter / pivot；未知值按 axis 回退。
        dimension_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartDimensionGroup'
          description: 旧协议 dims 映射为默认维度组（pivot=rows、pie=category、scatter=dims、其余=x_axis）。
        metric_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricGroup'
          description: 旧协议 metrics 映射为默认指标组 values。
        style:
          type: object
          additionalProperties: true
          description: 视觉样式扩展袋（Go map[string]any，omitempty）；当前 adapter 输出空对象。
        query_options:
          type: object
          additionalProperties: true
          description: 查询选项扩展袋（Go map[string]any，omitempty），如饼图长尾合并阈值。
    ChartDimensionGroup:
      type: object
      description: 维度组（query.DimensionGroup）。
      required:
        - name
        - label
        - fields
      properties:
        name:
          type: string
          description: 组标识，如 x_axis / rows / columns / category。
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChartDimensionField'
    ChartDimensionField:
      type: object
      description: 维度字段绑定（query.DimensionField）。
      required:
        - field
      properties:
        field:
          type: string
          description: 数据集列的 **id**（不是展示名）；SQL 输出别名与响应负载键才用展示名。
        label:
          type: string
        granularity:
          type: string
          description: 时间粒度（day / week / month 等）；执行前按方言校验（ValidateGranularity）。
        binding_id:
          type: string
          description: 绑定实例的唯一标识（对应前端 BindingInstance.bindingId），同一字段在不同槽位/组里有不同的 binding_id。
    ChartMetricGroup:
      type: object
      description: 指标组（query.MetricGroup）。
      required:
        - name
        - label
        - fields
      properties:
        name:
          type: string
          description: 组标识，如 values / primary_values / secondary_values。
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChartMetricField'
    ChartMetricField:
      type: object
      description: 指标字段绑定（query.MetricField）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
          description: 数据集列的 **id**（不是展示名）；SQL 输出别名与响应负载键才用展示名。
        label:
          type: string
        agg:
          type: string
          description: sum / avg / count / max / min（query.AggregationType）。
        alias:
          type: string
        unit:
          type: string
        format:
          type: string
        binding_id:
          type: string
          description: 绑定实例的唯一标识（对应前端 BindingInstance.bindingId），同一字段在不同槽位/组里有不同的 binding_id。
    QuerySpec:
      type: object
      description: >-
        查询语义规格（query.QuerySpec:46）：表达"查什么"，不含视觉语义，
        由 ChartSpec/旧请求转换而来，是 BunQueryBuilder 的上游输入。
      required:
        - dimensions
        - metrics
        - filters
      properties:
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionExpr'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricExpr'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterConfig'
        sort:
          $ref: '#/components/schemas/SortConfig'
        pagination:
          $ref: '#/components/schemas/ChartPagination'
        limit:
          type: integer
          description: 行数上限（Go omitempty，0 不出现在序列化 JSON）。
    DimensionExpr:
      type: object
      description: 结构化维度表达式（query.DimensionExpr）。
      required:
        - field
      properties:
        field:
          type: string
        label:
          type: string
        granularity:
          type: string
        group_name:
          type: string
          description: 来源槽位/组名（v2 协议 DimensionGroup.Name，如 x_axis / color_group）；v1 路径为空（Go omitempty）。
        binding_id:
          type: string
          description: 来源绑定实例标识（v2 协议 DimensionField.BindingID）；v1 路径为空（Go omitempty）。
    MetricExpr:
      type: object
      description: 结构化指标表达式（query.MetricExpr2；命名避开 ast.go 的 MetricExpr）。
      required:
        - field
        - agg
      properties:
        field:
          type: string
        agg:
          type: string
          description: sum / avg / count / max / min（query.AggregationType）。
        alias:
          type: string
        unit:
          type: string
        format:
          type: string
        group_name:
          type: string
          description: 来源槽位/组名（v2 协议 MetricGroup.Name，如 values / primary_values）；v1 路径为空（Go omitempty）。
        binding_id:
          type: string
          description: 来源绑定实例标识（v2 协议 MetricField.BindingID）；v1 路径为空（Go omitempty）。
    FilterConfig:
      type: object
      description: >-
        查询层过滤条件（query.FilterConfig）：JSON 键是 op，与旧协议 entity.Filter
        的 operator 不同；Batch 3 chart_spec 协议统一采用本形状。
      required:
        - field
        - op
        - value
        - logic
      properties:
        field:
          type: string
        op:
          type: string
          description: >-
            eq / neq / gt / gte / lt / lte / like / in / notIn / between / isNull / isNotNull；
            未知值后端按 "=" 回退（FilterOperator.ToString default）。
        value: {}
        value_end: {}
          # query.FilterConfig.ValueEnd interface{} omitempty：between 上界，任意 JSON 值
        logic:
          type: string
          description: 与其他条件的连接逻辑（如 "and" / "or"）。
    QueryRecordSpec:
      type: object
      description: >-
        bi_query.spec_json 的顶层信封（entity.QuerySpecEnvelope）。外层 v 管记录级
        schema 演进，内层 document 是前端的 ChartConfigDocument（自带 version:2 与
        迁移函数 migrateChartConfig）；后端只做信封校验与透传，不复制一份会漂移的
        类型定义。
      required:
        - v
        - document
      properties:
        v:
          type: integer
          description: 记录级 spec 版本；当前仅接受 1，其他值落库时返回 20100。
          example: 1
        document:
          type: object
          additionalProperties: true
          description: 图表配置文档（ChartConfigDocument v2）；后端不解释其内容。
    QueryRecordSaveRequest:
      type: object
      description: POST /api/queries 请求体（entity.QueryRecordSaveRequest）。
      required:
        - dataset_id
        - spec
      properties:
        dataset_id:
          type: integer
          description: 查询所属数据集；<=0 返回 20100。参与 spec_hash（同一份文档挂不同数据集不算同一条记录）。
        chart_id:
          type: integer
          description: 关联图表 ID；0/缺省表示草稿查询（落库为 NULL）。
        spec:
          $ref: '#/components/schemas/QueryRecordSpec'
        source_type:
          type: string
          description: 留痕来源，约定 build / share_url；空值默认 build，超 50 字符返回 20100。
        row_count:
          type: integer
          description: 结果行数；缺省表示未上报，去重命中时保留存量值而不是清零。
        duration_ms:
          type: integer
          description: 查询耗时（毫秒）；缺省表示未上报，去重命中时保留存量值。
    QueryRecordSaved:
      type: object
      description: 落库回执（entity.QueryRecordSaved）：地址栏需要的最小集合。
      required:
        - query_id
        - created_at
        - expires_at
      properties:
        query_id:
          type: string
          description: 地址栏短码（idcodec base58 定长 21 位），不是数据库里的 uuid 原文。
          example: CSatF9qXyRoQXFtAA3iZS
        created_at:
          type: string
          description: RFC3339。
        expires_at:
          type: string
          nullable: true
          description: RFC3339；null 表示永久（数据库里是 NULL）。
    QueryRecord:
      type: object
      description: >-
        GET /api/queries/{q} 读数模型（entity.QueryRecord）。不含 ip / spec_hash /
        owner_id / tenant_id：前者是留痕列，后两者是账号体系的预留列（本期无值），
        都不该出现在对外的分享读出口。
      required:
        - query_id
        - spec
        - dataset_id
        - chart_id
        - created_at
        - expires_at
        - expired
        - hit_count
      properties:
        query_id:
          type: string
          description: 地址栏短码，与请求路径中的 {q} 一致。
        spec:
          $ref: '#/components/schemas/QueryRecordSpec'
        dataset_id:
          type: integer
        chart_id:
          type: integer
          nullable: true
          description: null 表示未关联图表（草稿查询）。
        created_at:
          type: string
          description: RFC3339。
        expires_at:
          type: string
          nullable: true
          description: RFC3339；null 表示永久。
        expired:
          type: boolean
          description: 服务端按 expires_at 单字段派生的判定结果（null 视为未过期），客户端不重复实现。
        hit_count:
          type: integer
          description: 本次读取**之后**的累计命中次数（含本次 +1）。
    QueryRecordSaveResponse:
      description: POST /api/queries 响应：Envelope 特化 data 为 QueryRecordSaved。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/QueryRecordSaved'
    QueryRecordResponse:
      description: GET /api/queries/{q} 响应：Envelope 特化 data 为 QueryRecord。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/QueryRecord'
    Dashboard:
      type: object
      description: >-
        仪表盘响应实体（entity.Dashboard）。layout_json 是布局文档（DashboardLayout）
        的字符串形态：列是 JSONB，API 面是 string，与 Chart.config 同款约定。
        owner_id / tenant_id 是对内列，不在读出口。已软删的行不会出现在任何读出口。
        folder_id 是归档文件夹（第一期仅仪表盘），未归档为 null。
      required:
        - id
        - name
        - description
        - layout_json
        - status
        - folder_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: UUIDv7 字符串（非自增；PRD §6.5 一次性不可逆决策），由后端生成。
          example: 0198f2c3-4d5e-7a6b-8c9d-0e1f2a3b4c5d
        name:
          type: string
        description:
          type: string
          nullable: true
          description: 无描述时为 null（空串与 null 落库后不可区分，都记为 NULL）。
        folder_id:
          type: string
          nullable: true
          description: >-
            所属文件夹 id；未归档（根级）为 null。指向**已软删**文件夹时后端仍原样回显
            该 id（不做级联清洗），前端把这种行归到「未归档」桶里展示。
        layout_json:
          type: string
          description: >-
            布局文档的 JSON 字符串（结构见 DashboardLayout）。缺省
            {"version":1,"widgets":[]}，后端不解释其内容。

            ⚠️ 列是 jsonb，PostgreSQL 会规范化键序与空白：写接口（POST/PUT）把请求
            里的原文回显给你，读接口（GET/list）返回的是库里的规范形态。两者 JSON
            语义等价（前端按 DashboardLayout 解析即可），但**不要按字节比对**。
        status:
          type: string
          description: >-
            发布状态位（PRD R-73 / D9）。v1 只会出现 draft（新建缺省，UI 不暴露
            切换入口）；published 为将来分享预留。后端不做枚举强校验。
        created_at:
          type: string
          description: RFC3339。
        updated_at:
          type: string
          description: RFC3339；由后端在每次更新时显式前进（表无触发器）。
    DashboardCreateRequest:
      type: object
      description: >-
        POST /api/dashboards 请求体（entity.DashboardCreateRequest）。不含 id：
        主键由后端生成 UUIDv7。
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: 缺省或空串落库为 NULL。
        layout_json:
          type: string
          description: >-
            布局文档的 JSON 字符串；缺省/空串后端填 {"version":1,"widgets":[]}。
            非空但不是合法 JSON → 20100。
        status:
          type: string
          description: 缺省 draft。
        folder_id:
          type: string
          nullable: true
          description: >-
            新建时直接归档到该文件夹；缺省/null/空串都是「未归档」。指向不存在或已软删
            的文件夹 → 20300。
    DashboardUpdateRequest:
      type: object
      description: >-
        PUT /api/dashboards/{id} 请求体（entity.DashboardUpdateRequest）。五个字段
        **全部可选且都是「未提供则保留」**：缺省或 null 保持存量值（不是全量覆盖），
        与本仓库 datasource 密码、dataset 可选元数据同例。description 传空串表示
        清空为 NULL。
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: 缺省/null 保留存量；空串清空为 NULL；非空写入。
        layout_json:
          type: string
          description: 缺省/null 保留存量；非空但不是合法 JSON → 20100。
        status:
          type: string
          description: 缺省/null 保留存量。
        folder_id:
          type: string
          nullable: true
          description: >-
            **三态**（归档移动）：缺省或 null = 保留现有归档位置；`""`（空串）=
            **移出文件夹到未归档**（与文件夹 PUT 的 parent_id 同一哨兵口径）；
            UUID = 归档到该文件夹。目标不存在或已软删 → 20300。
    DashboardLayout:
      type: object
      description: >-
        layout_json 的解析后形态（PRD §6.2）。前端用 migrateDashboardLayout 做迁移：
        任何输入（空串 / 损坏 JSON / 非对象）都返回合法 v1 文档，绝不抛异常；version
        未知时按 v1 尽力解析。后端不做解析。
      required:
        - version
        - widgets
      properties:
        version:
          type: integer
          description: 文档版本；当前为 1。
          example: 1
        grid:
          type: object
          description: 仅持久化列数，供将来扩容判别。
          properties:
            cols:
              type: integer
              description: 栅格列数；当前固定 12。
              example: 12
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
    DashboardWidget:
      type: object
      description: >-
        盘内一块 widget，按 type 判别（chart | text | filter）：本 schema 是三者的
        扁平超集，字段适用性由 type 决定——chart 用 chartId/titleOverride，text 用
        markdown，filter 用 binding/label/dataType/operator/multi/defaultValue。

        契约上这是 oneOf-with-discriminator 语义，但生成物刻意不落成 union 类型：
        Go 侧为不引入 oapi-codegen/runtime 依赖（与 ChartDataResult.data 同款取舍），
        TS 侧消费方按 type 手动收窄。

        硬约束：widgetId 盘内唯一且**绝不等于 chartId**（PRD D1，同一 chartId 可以在
        同一盘里出现多次，各自独立 x/y/w/h）；chart 块只存引用不存快照。
      required:
        - widgetId
        - type
        - x
        - y
        - w
        - h
      properties:
        widgetId:
          type: string
          description: 盘内唯一主键；前端用 crypto.randomUUID() 生成，非 chartId。
          example: w-3f9c
        type:
          type: string
          enum:
            - chart
            - text
            - filter
        x:
          type: integer
          description: react-grid-layout 左上角列坐标（0 起）。
        y:
          type: integer
          description: react-grid-layout 左上角行坐标（0 起）。
        w:
          type: integer
          description: 宽度（列数），取值 [1,12]。
        h:
          type: integer
          description: 高度（行数）。
        chartId:
          type: integer
          description: type=chart 必填。引用 bi_chart.id 的反向关系，**不是快照**：图表改了盘内实时跟随，图表软删后该块保留原位并渲染占位。
        titleOverride:
          type: string
          nullable: true
          description: 可选，仅覆盖显示标题，不写回图表。
        markdown:
          type: string
          description: type=text 的 Markdown 内容；渲染前必须 sanitize（raw HTML 一律剔除）。
        binding:
          $ref: '#/components/schemas/DashboardFilterBinding'
        label:
          type: string
          description: type=filter 的显示名。
        dataType:
          type: string
          description: type=filter 绑定字段的数据类型（如 string / number / date）。
        operator:
          type: string
          description: type=filter 的算子（如 in）；与图表过滤算子同一词表见 Filter.operator。
        multi:
          type: boolean
          description: type=filter 是否允许多选。
        date:
          type: object
          description: >-
            type=filter 且绑定字段是日期类时的粒度与周计算逻辑（口径见前端 lib/dateFilter.ts）。
            **后端只做投影解析、不读这个键**：盘级筛选的取值由前端按它现算成具体区间后随请求下发。
          properties:
            granularity:
              type: string
              enum: [hour, day, week, month]
              description: 粒度；hour 仅对带时分秒的 datetime 字段有意义。
            weekStart:
              type: integer
              minimum: 0
              maximum: 6
              description: 周计算逻辑：一周从星期几开始（0=周日 … 6=周六）。缺省 1（周一）。
        defaultValue:
          type: array
          description: >-
            type=filter 的默认选中值。**空数组 = 未激活**：未激活的筛选器不参与合并、
            不触发覆盖（PRD §8.3 步骤 2），否则拖入一个筛选器会莫名抹掉图表默认条件。
          items: {}
    DashboardFilterBinding:
      type: object
      description: >-
        盘级筛选器的绑定粒度：数据集字段。按 (datasetId, column) 二元组命中同数据集的
        图表（PRD §11-2 的推荐口径，避免跨数据集同名字段静默误伤）。
      required:
        - datasetId
        - column
      properties:
        datasetId:
          type: integer
        column:
          type: string
          description: >-
            **列的稳定 id（DatasetColumn.id），不是列名。** 盘级条件最终以 entity.Filter.Field
            参与取数，而「哪些字段被盘级条件覆盖」（响应里的 overriddenFields）是拿图表自身过滤
            条件里的列 id 求交集得出的 —— 存列名会让这个可见标识永远匹配不上。列名可变，只用于展示。
    DashboardQueryFilter:
      type: object
      description: POST /api/dashboards/{id}/query 的单个筛选器当前取值（按下发顺序应用）。
      required:
        - widgetId
      properties:
        widgetId:
          type: string
          description: 对应布局里 type=filter 的 widgetId。
        value:
          type: array
          description: 当前选中值；空数组等同于未激活。
          items: {}
    DashboardQueryRequest:
      type: object
      description: >-
        POST /api/dashboards/{id}/query 请求体（PRD §6.3）。前端只下筛选器的当前值，
        **不解析 chart config、不下发合并结果**：筛选合并是后端单点逻辑（可测）。
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DashboardQueryFilter'
    DashboardQueryResult:
      type: object
      description: 单块取数结果（PRD §6.3）。单块失败不整盘失败。
      required:
        - widgetId
        - chartId
        - status
      properties:
        widgetId:
          type: string
        chartId:
          type: integer
          description: 被引用图表的 id；图表不存在时可能是原始引用值。
        status:
          type: string
          description: >-
            ok（成功）/ chart_deleted（图表已软删，块保留原位渲染占位）/
            chart_missing（chart_id 不存在）/ error（该块取数失败）。
        data:
          description: >-
            成功时与 POST /api/charts/query **响应里的 data 字段**同形（即完整的
            ChartDataResult：含内层 data 与 select_sql），消费方按 chart_type 判别内层形状；
            chart_deleted / chart_missing / error 时为 null。
        appliedFields:
          type: array
          description: 本块实际生效的盘级筛选字段（去重、保序）。
          items:
            type: string
        overriddenFields:
          type: array
          description: >-
            本块被盘级筛选覆盖掉的图表自身同字段条件（appliedFields 与图表自身过滤字段的
            交集）。竞析建议的「覆盖可见标识」，PRD §11-1a。
          items:
            type: string
        message:
          type: string
          description: >-
            仅 status=error 时出现，携带该块取数失败的原因。单块失败不让整盘失败，
            因此原因只在这里暴露，不占用全局错误码。
    DashboardListResponse:
      description: GET /api/dashboards 响应：data 为 Dashboard 数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Dashboard'
    DashboardResponse:
      description: 仪表盘 CRUD 响应：data 为单个 Dashboard。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Dashboard'
    DashboardQueryResponse:
      description: >-
        POST /api/dashboards/{id}/query 响应：data.results 为逐块结果数组，顺序与
        layout 里 type=chart 的块一致（前端据 widgetId 归位）。单块失败不整盘失败：
        该块 status=error 并带 message，其余块照常返回；无图表块（或无图表块的合法
        布局）返回空数组。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - results
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/DashboardQueryResult'
    ChartReference:
      type: object
      description: >-
        GET /api/charts/{id}/references 的业务负载（entity.ChartReference）：
        引用某图表的未软删仪表盘。提示不阻断删除（PRD D2 / R-75）。
      required:
        - count
        - dashboards
      properties:
        count:
          type: integer
          description: 引用该图表的仪表盘数，等于 dashboards 的长度。
        dashboards:
          type: array
          description: 引用方身份（id + name）；无引用时为空数组。
          items:
            $ref: '#/components/schemas/ChartReferenceItem'
    DashboardFolder:
      type: object
      description: >-
        仪表盘文件夹响应实体（entity.DashboardFolder）。树由前端按 parent_id 组装，
        后端不落派生路径。已软删的行不会出现在任何读出口。
      required:
        - id
        - name
        - parent_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: UUIDv7 字符串（与仪表盘同款不可枚举主键），由后端生成。
          example: 0198f2c3-4d5e-7a6b-8c9d-0e1f2a3b4c5d
        name:
          type: string
        parent_id:
          type: string
          nullable: true
          description: 父文件夹 id；根级为 null。
        created_at:
          type: string
          description: RFC3339。
        updated_at:
          type: string
          description: RFC3339；由后端在每次更新时显式前进（表无触发器）。
    DashboardFolderCreateRequest:
      type: object
      description: >-
        POST /api/dashboard-folders 请求体（entity.DashboardFolderCreateRequest）。
        不含 id：主键由后端生成 UUIDv7。
      required:
        - name
      properties:
        name:
          type: string
        parent_id:
          type: string
          nullable: true
          description: >-
            父文件夹 id；缺省/null/空串都是根级（空串在此与 null 等价——根级本来就是
            「无父级」，不需要哨兵）。目标不存在或已软删 → 20300。
    DashboardFolderUpdateRequest:
      type: object
      description: >-
        PUT /api/dashboard-folders/{id} 请求体（entity.DashboardFolderUpdateRequest）。
        两个字段全部可选，遵循「未提供则保留」。
      properties:
        name:
          type: string
          description: 缺省/null 保留存量；空串 → 20100（夹名不可为空）。
        parent_id:
          type: string
          nullable: true
          description: >-
            **三态**：缺省或 null = 保留现有父级（只改名）；`""`（空串）= **移到根级**
            （清空父级的显式哨兵）；UUID = 移到该文件夹下。目标不存在/已软删 → 20300；
            移动到自己或任意后代（成环）→ 20400。
    DashboardFolderListResponse:
      description: GET /api/dashboard-folders 响应：data 为 DashboardFolder 数组（扁平）。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DashboardFolder'
    DashboardFolderResponse:
      description: 仪表盘文件夹 CRUD 响应：data 为单个 DashboardFolder。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/DashboardFolder'
    ChartReferenceItem:
      type: object
      description: 引用方仪表盘的最小身份（删除提示只需要这两项）。
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: 仪表盘 UUID。
        name:
          type: string
    ChartReferenceResponse:
      description: GET /api/charts/{id}/references 响应：Envelope 特化 data 为 ChartReference。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ChartReference'
  parameters:
    DashboardId:
      name: id
      in: path
      required: true
      description: >-
        仪表盘 id（gin 通配符 :id）：UUID 字符串形态（后端生成 UUIDv7，非自增）。
        非 UUID → 20100；格式合法但不存在/已软删 → 20300。
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    DashboardFolderId:
      name: id
      in: path
      required: true
      description: >-
        仪表盘文件夹 id（gin 通配符 :id）：UUID 字符串形态（后端生成 UUIDv7，非自增）。
        非 UUID → 20100；格式合法但不存在/已软删 → 20300。
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    DatasourceId:
      name: id
      in: path
      required: true
      description: 数据源 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    DatasetId:
      name: id
      in: path
      required: true
      description: 数据集 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    ChartId:
      name: id
      in: path
      required: true
      description: 图表 ID（gin 通配符 :id；非法数字返回 20100）。
      schema:
        type: integer
    ShareToken:
      name: token
      in: path
      required: true
      description: >-
        分享 token（gin 通配符 :token）；后端生成格式 hex(8B)-hex(8B)，
        API 层按不透明字符串处理。
      schema:
        type: string
    QueryShortId:
      name: q
      in: path
      required: true
      description: >-
        查询记录短码（gin 通配符 :q）；idcodec 的 base58 定长 21 位，字符集为
        123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz（不含 0 O I l）。
        长度或字符集不符 → 20100；解码成功但无此记录 → 20300。
      schema:
        type: string
        minLength: 21
        maxLength: 21
        pattern: '^[1-9A-HJ-NP-Za-km-z]{21}$'
    TableName:
      name: table
      in: path
      required: true
      description: >-
        表名；spec 占位符 {table} 与 gin 通配符 `:table` 对应，须为合法标识符，
        前端以 URL 编码传输。
      schema:
        type: string

