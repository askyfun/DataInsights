server {
    listen 23351;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（/datasets/12、/share/<token> 等）由 React Router 接管：
    # 静态文件不存在时回落 index.html，否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 每次校验：否则发版后浏览器仍加载旧版本引用的旧 chunk
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 同源反代：对外只暴露 23351，后端 23352 无需对外开，也不再依赖 CORS 白名单。
    # 依赖 docker-compose 的服务名 backend 解析（此配置只在容器内使用）。
    location /api/ {
        proxy_pass http://backend:23352;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
        # 前端 axios 超时 30s，留出余量，避免代理先断连
        proxy_read_timeout 60s;
    }
}
