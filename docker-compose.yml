services:
  postgres:
    image: postgres:16
    container_name: data-insights-postgres
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights123
      POSTGRES_DB: insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前后端编译进同一个镜像、同一个进程、同一个端口：没有 nginx，也没有第二个容器。
  # 构建上下文是仓库根目录。
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite 的 VITE_* 是构建期内联进产物的，只能以 build arg 传入；
        # 容器起起来之后再给环境变量没有任何作用。
        # VITE_API_BASE_URL 不传：生产构建默认同源，无需任何配置。
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: data-insights-app
    # 后端不读任何配置文件，所有配置通过环境变量注入。
    # 以下变量可通过三种方式覆盖（优先级高 → 低）：
    #   1. shell 环境变量：DATABASE_URL=... docker compose up
    #   2. 仓库根 .env 文件：docker compose 会自动加载同目录 .env 做插值
    #   3. 直接修改本文件里的默认值
    # 不再强制要求 `cp .env.example .env`。
    environment:
      # compose 网络内的数据库是服务名 postgres；默认值已指向 compose 自带的 PostgreSQL。
      DATABASE_URL: ${DATABASE_URL:-postgres://insights:insights123@postgres:5432/insights?sslmode=disable}
      PORT: ${PORT:-23352}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SECURITY_KEY: ${SECURITY_KEY:-}
    ports:
      # 容器内监听端口与宿主机映射端口保持一致；通过 PORT 变量统一控制。
      - "${PORT:-23352}:${PORT:-23352}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
